services:
  opencode:
    # 镜像双变体（同一发行号两种 tag，按需选用；发行号为北京日期 Calver，与组件版本解耦，
    # 各组件锁定版本见对应 GitHub Release 说明）：
    #   - vYYYY.MM.DD-desktop（默认）：带 XFCE4/xrdp 远程桌面的完整版（Desktop-Base）
    #   - vYYYY.MM.DD（无后缀，如 v2026.09.29）：slim 版（NoDesktop-Base），不含远程桌面，
    #     下方 3390 端口映射与 ENABLE_DESKTOP/DESKTOP_PASSWORD 等桌面配置自动失效/跳过
    image: ghcr.io/zhongruan0522/cloud-development:${OPENCODE_SERVER_VERSION:-v2026.09.29-desktop}
    container_name: opencode
    ports:
      # Codex登录端口
      - "0.0.0.0:1455:1455"
      # OpenCode端口
      - "127.0.0.1:4096:4096"
      # SSH 端口（容器内端口由 SSH_PORT 决定，改端口时两侧需同步）
      - "0.0.0.0:2223:2223"
      # 远程桌面 (RDP) 端口
      - "127.0.0.1:3390:3390"
    environment:
      # OpenChamber（主服务入口，托管 opencode serve，端口 4096）
      - OPENCHAMBER_UI_PASSWORD=${OPENCHAMBER_UI_PASSWORD:-} # OpenChamber 浏览器 UI 登录密码，留空则无密码保护（对外暴露时务必设置）
      - OPENCHAMBER_HOST=${OPENCHAMBER_HOST:-0.0.0.0} # OpenChamber 监听地址，默认 0.0.0.0 以支持容器端口映射
      - OPENCODE_ENABLE_EXA=${OPENCODE_ENABLE_EXA:-true} # 是否启用 OpenCode 的 Exa 搜索能力
      # 主账号 / SSH（镜像不预建用户，容器启动时按 SSH_USER 创建并运行全部服务）
      - SSH_USER=${SSH_USER:-root} # 主账号名（openchamber/serena 运行身份 + SSH 登录账号）；默认 root，非 root 值会在启动时创建普通用户
      - SSH_PORT=${SSH_PORT:-2223} # sshd 监听端口，与上方 ports 映射保持一致
      - SSH_PASSWORD=${SSH_PASSWORD:-} # 主账号密码；设置即启用 SSH 密码认证（公钥认证始终并存），留空=仅公钥
      # GitHub
      # gh CLI 不再走 GITHUB_TOKEN 环境变量登录：手动 `gh auth login` 一次，
      # 凭据持久化在下方挂载的 ./.config/gh 卷里，容器重建后保持登录态
      - GITHUB_SSH_KEY=${GITHUB_SSH_KEY:-} # GitHub SSH 私钥（base64 编码），留空则不注入 id_rsa
      # Playwright
      - PLAYWRIGHT_BROWSERS_PATH=/root/.cache/ms-playwright # Playwright 浏览器缓存目录，使用 base 镜像预装的 Chromium
      - PLAYWRIGHT_MCP_HEADLESS=1 # Playwright MCP 默认无头模式运行
      - PLAYWRIGHT_MCP_BROWSER=chromium # Playwright MCP 浏览器，chromium=Playwright bundled（支持 --load-extension）；品牌 Chrome 已移除
      - PLAYWRIGHT_MCP_SANDBOX=0 # 容器内 Chromium 禁用 sandbox，避免权限问题（Playwright 源码只读 SANDBOX，NO_SANDBOX 是死变量）
      # UID/GID（主账号为普通用户时的 uid/gid；SSH_USER=root 时忽略）
      - LOCAL_UID=${LOCAL_UID:-10001} # 主账号 uid，与宿主挂载目录属主对齐可减少权限问题
      - LOCAL_GID=${LOCAL_GID:-10001} # 主账号 gid
      # 远程桌面 (xrdp + XFCE4)
      - ENABLE_DESKTOP=${ENABLE_DESKTOP:-1} # 是否启用 xrdp 远程桌面，默认启用，端口 3390
      - DESKTOP_USER=${DESKTOP_USER:-desktop} # 桌面用户名，默认 desktop（镜像内预建账号，启动时按此变量改名）
      - DESKTOP_PASSWORD=${DESKTOP_PASSWORD:-app} # 主账号 RDP 登录密码（仅 ALLOW_APP_DESKTOP=1 时生效），建议改为强密码
      - DESKTOP_USER_PASSWORD=${DESKTOP_USER_PASSWORD:-} # DESKTOP_USER 的 RDP 登录密码，留空则复用 DESKTOP_PASSWORD，两者都空则无密码登录
      - ALLOW_APP_DESKTOP=${ALLOW_APP_DESKTOP:-1} # 是否允许主账号（SSH_USER）桌面登录，1=允许（默认，向后兼容），0=禁用（仅 DESKTOP_USER 可登录）
      # DinD
      - ENABLE_DOCKERD=${ENABLE_DOCKERD:-0} # 是否开机自启 DinD dockerd，默认关闭以节省内存。运行中可 supervisorctl start dockerd 手动拉起
      # mihomo (Clash) 代理
      - ENABLE_CLASH=${ENABLE_CLASH:-0} # 是否启用 mihomo (Clash) TUN 模式代理；1=启用，接管所有出站流量
      - CLASH_CONFIG_PATH=${CLASH_CONFIG_PATH:-} # Clash/mihomo 订阅配置文件在容器内的路径（需通过 volumes 挂载进来）
    ulimits:
      core:
        soft: 0
        hard: 0
    privileged: true
    # Chrome/Chromium 用 /dev/shm 做进程间共享内存，Docker 默认仅 64MB，
    # 桌面会话中打开浏览器会因 shm 不足触发 EIO（"输入/输出错误"）并频繁崩溃。
    # 提升到 2GB 彻底消除该瓶颈（xdpyinfo、Playwright、GUI Chrome 共同受益）。
    shm_size: "2gb"
    volumes:
      # === 工作区 ===
      - ./workspace:/workspace:rshared

      # === mihomo (Clash) 配置 ===
      # 将宿主机的 Clash/mihomo 配置文件挂载到容器内，
      # CLASH_CONFIG_PATH 设置为此路径即可（如 /etc/clash-user/config.yaml）。
      # 用法：把你的 Clash Verge 导出的 YAML 放到 ./app-config/clash/config.yaml，
      # 然后设置 ENABLE_CLASH=1 和 CLASH_CONFIG_PATH=/etc/clash-user/config.yaml
      # - ./app-config/clash:/etc/clash-user:rshared
      
      # 主服务
      # === Git 配置 ===
      - ./app-config/.git-credentials:/root/.git-credentials:rshared
      - ./app-config/.gitconfig:/root/.gitconfig:rshared
      - ./.config/gh:/root/.config/gh:rshared
      # === SSH ===
      - ./app-config/authorized_keys:/root/.ssh/authorized_keys:ro # SSH 公钥文件（可选），挂载后启用公钥登录并分发给 root/主账号/桌面用户；密码登录走 SSH_PASSWORD
      
      # CLI
      # === OpenCode 配置 ===
      - ./.config/opencode/agents:/root/.config/opencode/agents:rshared
      - ./.config/opencode/plugins:/root/.config/opencode/plugins:rshared
      - ./.config/opencode/skills:/root/.config/opencode/skills:rshared
      - ./.config/opencode/AGENTS.md:/root/.config/opencode/AGENTS.md:rshared
      - ./.config/opencode/opencode.json:/root/.config/opencode/opencode.json:rshared
      - ./.local/share/opencode:/root/.local/share/opencode:rshared
      # === OpenCode 附属依赖 - Serena ===
      - ./.serena:/root/.serena:rshared
      # === Anthropic Claude Code ===
      - ./.claude:/root/.claude:rshared
      # === OpenAI Codex ===
      - ./.codex:/root/.codex:rshared
      # === 飞书CLI ===
      - ./.lark-cli:/root/.lark-cli:rshared
      - ./.local/share/lark-cli:/root/.local/share/lark-cli:rshared

    networks:
      - 1panel-network
    restart: unless-stopped
    # 日志轮换限制：保留 3 个历史文件，每个最大 350MB，总预算约 1GB，便于排查长期运行日志。
    logging:
      driver: "json-file"
      options:
        max-size: "350m"
        max-file: "3"

networks:
  1panel-network:
    external: true
