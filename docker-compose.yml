services:
  # 注意！！！默认是挂载在1panel的网卡上面，使用之前请自行确认
  opencode:
    # 启动之前请先对其你所打包的镜像！！
    #   - vYYYY.MM.DD-desktop（默认）：带 XFCE4/xrdp 远程桌面的完整版（Desktop-Base）
    #   - vYYYY.MM.DD（无后缀，如 v2026.09.29）：slim 版（NoDesktop-Base），不含远程桌面，
    image: ghcr.io/zhongruan0522/cloud-development:${OPENCODE_SERVER_VERSION:-v2026.09.29-desktop}
    container_name: opencode
    ports:
      # Codex登录端口
      - "0.0.0.0:1455:1455"
      # OpenCode端口
      - "127.0.0.1:4096:4096"
      # SSH 端口（容器内端口由 SSH_PORT 决定，改端口建议两侧需同步）
      - "0.0.0.0:2223:2223"
      # 远程桌面 (RDP) 端口
      - "127.0.0.1:3390:3390"
      # 内置 PostgreSQL/MySQL/openGauss/KingbaseES 四库统一监听 0.0.0.0（entrypoint/启动参数
      # 统一放开），对外暴露完全由下方端口映射控制：默认注释不发布=仅容器内可达；
      # 取消注释即发布（宿主机侧绑 127.0.0.1 仅本机可用，改 0.0.0.0 则局域网可访问）。
      # TCP 一律密码认证（PG scram-sha-256 / MySQL caching_sha2 / openGauss 内核强制 /
      # KingbaseES scram-sha-256，密码均为 DB_PASSWORD）。
      # - "127.0.0.1:15432:5432"
      # - "127.0.0.1:13306:3306"
      # - "127.0.0.1:15433:5433"
      # - "127.0.0.1:15434:54321"
    # 健康检查（按需启用，示例见下；镜像刻意不内置 HEALTHCHECK——部署形态各异，
    # 探活逻辑统一在 base/healthcheck.sh）。启用时注意：三库由 entrypoint 后台并行
    # 初始化，首启到全部就绪最慢约 40s（openGauss），healthcheck.sh 语义保持诚实
    # （初始化窗口内三库 STOPPED 即判失败），start_period 必须覆盖该窗口——否则
    # 初始化期内即累计失败次数，被编排侧重启后 openGauss 又被 .initializing 标记
    # 清库重初始化，形成"永远初始化不完"的重启循环。
    # healthcheck:
    #   test: ["CMD", "/usr/local/bin/healthcheck.sh"]
    #   interval: 30s
    #   timeout: 10s
    #   retries: 3
    #   start_period: 120s
    environment:
      # === OpenCode && OpenChamber ===
      - OPENCHAMBER_UI_PASSWORD=${OPENCHAMBER_UI_PASSWORD:-} # OpenChamber 登录密码
      - OPENCHAMBER_HOST=${OPENCHAMBER_HOST:-0.0.0.0} # OpenChamber 监听地址
      # === SSH ===
      - SSH_USER=${SSH_USER:-root} # 运行环境用户名；默认 root，非 root 值会在启动时创建普通用户！
      - SSH_PORT=${SSH_PORT:-2223} # sshd 监听端口，与上方 ports 映射保持一致
      - SSH_PASSWORD=${SSH_PASSWORD:-} # 运行环境用户SSH密码
      # === GitHub ===
      # gh CLI 不再走 GITHUB_TOKEN 环境变量登录：手动 `gh auth login` 一次，
      # 凭据落在 ./.config/gh 卷持久化；SSH 私钥走下方 GITHUB_SSH_KEY（base64）。
      - GITHUB_SSH_KEY=${GITHUB_SSH_KEY:-} # GitHub SSH 私钥（base64 编码），非空时启动注入 /root/.ssh/id_rsa，可留空
      - GITHUB_SSH_KEYSCAN_TIMEOUT=${GITHUB_SSH_KEYSCAN_TIMEOUT:-10s} # ssh-keyscan github.com 超时，仅设置 GITHUB_SSH_KEY 时生效
      # === Playwright ===
      # PLAYWRIGHT_BROWSERS_PATH 不再显式声明：镜像 ENV 已设 /opt/ms-playwright
      # （系统路径全用户可读），此处覆写曾把桌面变体 desktop 用户指回 /root 私有路径。
      - PLAYWRIGHT_MCP_HEADLESS=1 # Playwright MCP 默认无头模式运行
      - PLAYWRIGHT_MCP_BROWSER=chromium # Playwright MCP 浏览器
      - PLAYWRIGHT_MCP_SANDBOX=0 # 容器内 Chromium 禁用 sandbox
      # === UID/GID（主账号为普通用户时的 uid/gid；SSH_USER=root 时忽略） ===
      - LOCAL_UID=${LOCAL_UID:-10001} # 主账号 uid，需要和SSH账户对齐
      - LOCAL_GID=${LOCAL_GID:-10001} # 主账号 gid，需要和SSH账户对齐
      # === 远程桌面 - 需要镜像为Desktop变体方可有效 ===
      - ENABLE_DESKTOP=${ENABLE_DESKTOP:-1} # 是否启用 xrdp 远程桌面，默认启用，端口 3390
      - DESKTOP_USER=${DESKTOP_USER:-desktop} # 桌面用户名，默认 desktop（镜像内预建账号，启动时按此变量改名）
      - DESKTOP_PASSWORD=${DESKTOP_PASSWORD:-app} # 主账号 RDP 登录密码（仅 ALLOW_APP_DESKTOP=1 时生效）
      - DESKTOP_USER_PASSWORD=${DESKTOP_USER_PASSWORD:-} # DESKTOP_USER 的 RDP 登录密码，留空则复用 DESKTOP_PASSWORD，两者都空则无密码登录
      - ALLOW_APP_DESKTOP=${ALLOW_APP_DESKTOP:-1} # 是否允许主账号（SSH_USER）桌面登录，1=允许（默认，向后兼容），0=禁用（仅 DESKTOP_USER 可登录）

      # === 开机自启动服务管理 ===
      # DinD
      - ENABLE_DOCKERD=${ENABLE_DOCKERD:-1}
      # 数据库
      - ENABLE_PG=${ENABLE_PG:-1}
      - ENABLE_MYSQL=${ENABLE_MYSQL:-1}
      - ENABLE_OPENGAUSS=${ENABLE_OPENGAUSS:-1}
      - ENABLE_KINGBASE=${ENABLE_KINGBASE:-1}
      - DB_PASSWORD=${DB_PASSWORD:-Opencode@123} # 四库统一数据库密码（PG 用户 postgres / MySQL 用户 root / openGauss 用户 omm / KingbaseES 用户 system，均为各库官方默认账号），仅首启初始化生效，已有数据卷不追溯（改密须进容器 ALTER USER）。openGauss 强制密码复杂度（>=8 位且大小写/数字/特殊字符至少三类），弱密码会使其首启 gs_initdb 直接失败退出
      # Clash
      - ENABLE_CLASH=${ENABLE_CLASH:-1}
      - CLASH_CONFIG_PATH=${CLASH_CONFIG_PATH:-} # Clash/mihomo 订阅配置文件在容器内的路径
    ulimits:
      core:
        soft: 0
        hard: 0
    privileged: true
    # Chrome/Chromium 用 /dev/shm 做进程间共享内存，Docker 默认仅 64MB，桌面会话中打开浏览器会因 shm 不足触发 EIO（"输入/输出错误"）并频繁崩溃。
    shm_size: "2gb"
    volumes:
      # === 工作区 ===
      - ./workspace:/workspace:rshared

      # 主服务
      # === Git 配置 ===
      - ./app-config/.git-credentials:/root/.git-credentials:rshared
      - ./app-config/.gitconfig:/root/.gitconfig:rshared
      - ./.config/gh:/root/.config/gh:rshared
      # === SSH ===
      - ./app-config/authorized_keys:/root/.ssh/authorized_keys:ro
      # === 数据库持久化 ===
      # 注意：数据库卷须专卷专用，勿挂入含其他 PG/MySQL/openGauss/KingbaseES 版本数据目录的卷（版本不匹配将无法启动）
      - ./postgres:/var/lib/postgresql:rshared
      - ./mysql:/var/lib/mysql:rshared
      - ./opengauss:/var/lib/opengauss:rshared
      - ./kingbase:/var/lib/kingbase:rshared
      
      # Agent
      # === OpenCode 配置 ===
      - ./.config/opencode/agents:/root/.config/opencode/agents:rshared
      - ./.config/opencode/plugins:/root/.config/opencode/plugins:rshared
      - ./.config/opencode/skills:/root/.config/opencode/skills:rshared
      - ./.config/opencode/AGENTS.md:/root/.config/opencode/AGENTS.md:rshared
      - ./.config/opencode/opencode.json:/root/.config/opencode/opencode.json:rshared
      - ./.local/share/opencode:/root/.local/share/opencode:rshared
      # === OpenCode 附属依赖 - Serena ===
      - ./.serena:/root/.serena:rshared
      # === Anthropic Claude Code ===
      - ./.claude:/root/.claude:rshared
      # === OpenAI Codex ===
      - ./.codex:/root/.codex:rshared
      # === Factory Droid ===
      - ./.factory:/root/.factory:rshared
      # === CodeBuddy Code（腾讯云）===
      - ./.codebuddy:/root/.codebuddy:rshared
      # === Kiro CLI ===
      - ./.kiro:/root/.kiro:rshared

    networks:
      - 1panel-network
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "350m"
        max-file: "3"

networks:
  1panel-network:
    external: true
