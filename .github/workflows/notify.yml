name: Notify Feishu

# 监听构建类工作流完成事件。仅 default branch (main) 触发，可正常读取仓库 secrets。
# 注意：PR 触发的上游构建不会派发 workflow_run 事件，这是 GHA 的安全限制，符合预期。
on:
  workflow_run:
    workflows:
      - Build Base Image
      - Build Desktop Image
      - Build and Push Docker Image
    types:
      - completed

jobs:
  notify:
    # 上游被跳过/取消时不通知，避免噪音
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read

    steps:
      - name: Resolve notification context
        id: ctx
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          WF_NAME: ${{ github.event.workflow_run.name }}
          REPO: ${{ github.repository }}
          # updated_at 为上游工作流完成时间（UTC ISO），转成北京时间可读格式
          UPDATED_AT: ${{ github.event.workflow_run.updated_at }}
        run: |
          set -euo pipefail

          # 动态层存在“无更新不打包”运行：打包闸门放空后构建与 Release job 全部跳过，
          # 工作流整体仍记 success，但这不是一次打包，不发卡避免误报。
          # 注意：这里不能直接 exit 0——它只结束本 step，后续发卡 step 仍会带着
          # 空的 template_id 调飞书 API 并报 230099（templateID 为空）。
          # 改为输出 suppress 标记，由发卡 step 的 if 条件跳过。
          if [ "$WF_NAME" = "Build and Push Docker Image" ]; then
            RELEASE_CONCLUSION=$(gh api "repos/$REPO/actions/runs/$RUN_ID/jobs" \
              --jq '[.jobs[] | select(.name == "Create or update GitHub Release")][0].conclusion // empty')
            if [ -z "$RELEASE_CONCLUSION" ] || [ "$RELEASE_CONCLUSION" = "skipped" ]; then
              echo "Dynamic-layer run packaged nothing (release job absent or skipped); suppressing notification."
              echo "suppress=true" >> $GITHUB_OUTPUT
              exit 0
            fi
          fi

          # 1. 根据构建结论选择卡片模板
          if [ "$CONCLUSION" = "success" ]; then
            echo "template_id=AAqv2e8wrOFTm" >> $GITHUB_OUTPUT
          else
            echo "template_id=AAqv27Co32Y8H" >> $GITHUB_OUTPUT
          fi

          # 2. 根据工作流名称映射镜像层（Branch 变量语义为「镜像层级」，非 git 分支）
          #    一条通知只声明本层打包完成：Base 层 / 桌面层 / 动态层。
          #    动态层的 slim 与 desktop 双变体在同一次 run 内并行完成，不再区分变体粒度。
          case "$WF_NAME" in
            "Build Base Image")
              echo "layer=Base 层" >> $GITHUB_OUTPUT
              ;;
            "Build Desktop Image")
              echo "layer=桌面层" >> $GITHUB_OUTPUT
              ;;
            "Build and Push Docker Image")
              echo "layer=动态层" >> $GITHUB_OUTPUT
              ;;
            *)
              echo "Unmapped workflow name for layer: $WF_NAME" >&2
              exit 1
              ;;
          esac

          # 3. 构建完成时间转北京时间
          # 卡片模板 Time 变量声明为 DateTime 类型，固定格式 yyyy-MM-dd HH:mm（不带秒）
          TIME_BJ=$(TZ='Asia/Shanghai' date -d "$UPDATED_AT" '+%Y-%m-%d %H:%M')
          echo "time=${TIME_BJ}" >> $GITHUB_OUTPUT

          # 4. 透传工作流名与仓库名
          echo "wf_name=${WF_NAME}" >> $GITHUB_OUTPUT
          echo "project_name=${REPO}" >> $GITHUB_OUTPUT

      - name: Fetch Feishu tenant access token
        id: token
        if: steps.ctx.outputs.suppress != 'true'
        env:
          APP_ID: ${{ secrets.FEISHU_APP_ID }}
          APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
        run: |
          set -euo pipefail
          # 用 jq 解析 token，避免明文打印到日志
          # 不使用 -f：飞书鉴权失败返回 HTTP 400 + JSON body，需要读取 code/msg 定位根因
          TOKEN=$(curl -sS -X POST \
            -H 'Content-Type: application/json' \
            -d "{\"app_id\":\"${APP_ID}\",\"app_secret\":\"${APP_SECRET}\"}" \
            https://open.feishu.cn/open-apis/auth/v3/tenant_access_token/internal \
            -o token_response.json; \
            jq -r '.tenant_access_token // empty' token_response.json)

          if [ -z "$TOKEN" ]; then
            CODE=$(jq -r '.code // empty' token_response.json)
            MSG=$(jq -r '.msg // empty' token_response.json)
            echo "Failed to fetch tenant_access_token. code=${CODE}, msg=${MSG}" >&2
            exit 1
          fi

          # 必须用 ::add-mask:: 指令本身携带值，GHA 会在打印前完成 mask；
          # 若先 echo 再 mask，token 会在 masking 生效前泄露到日志。
          echo "::add-mask::${TOKEN}"
          echo "value=${TOKEN}" >> $GITHUB_OUTPUT

      - name: Send interactive card
        if: steps.ctx.outputs.suppress != 'true'
        env:
          TOKEN: ${{ steps.token.outputs.value }}
          USER_ID: ${{ secrets.FEISHU_USER_ID }}
          TEMPLATE_ID: ${{ steps.ctx.outputs.template_id }}
          PROJECT_NAME: ${{ steps.ctx.outputs.project_name }}
          LAYER: ${{ steps.ctx.outputs.layer }}
          TIME: ${{ steps.ctx.outputs.time }}
          ACTIONS_NAME: ${{ steps.ctx.outputs.wf_name }}
        run: |
          set -euo pipefail

          # 飞书模板卡片 content 字段需要是序列化后的 JSON 字符串
          # 仅传模板约定的四个变量：Project_Name / Branch / Time / Actions_name
          CONTENT=$(jq -nc \
            --arg template_id "$TEMPLATE_ID" \
            --arg project_name "$PROJECT_NAME" \
            --arg branch "$LAYER" \
            --arg time "$TIME" \
            --arg actions_name "$ACTIONS_NAME" \
            '{
              type: "template",
              data: {
                template_id: $template_id,
                template_version_name: "1.0.4",
                template_variable: {
                  Project_Name: $project_name,
                  Branch: $branch,
                  Time: $time,
                  Actions_name: $actions_name
                }
              }
            }')

          # 将 content 字符串塞进外层请求体；所有字段均来自 env，不会进入命令行回显
          PAYLOAD=$(jq -nc \
            --arg receive_id "$USER_ID" \
            --arg content "$CONTENT" \
            '{receive_id: $receive_id, msg_type: "interactive", content: $content}')

          # receive_id_type 必须作为 query param 传递
          # 不打印 PAYLOAD，直接通过管道投递，避免 user_id 等出现在日志
          # 不使用 -f：飞书业务错误（如卡片变量不匹配）会返回 HTTP 400 + JSON body，
          # curl -f 会把这种情况当成传输错误吞掉响应体，导致无法定位真实原因。
          # 改用 -sS：静默 curl 自身进度，但仍显示传输层错误；HTTP 4xx/5xx 一律落盘
          echo "$PAYLOAD" | curl -sS -X POST \
            -H 'Content-Type: application/json; charset=utf-8' \
            -H "Authorization: Bearer ${TOKEN}" \
            --data-binary @- \
            "https://open.feishu.cn/open-apis/im/v1/messages?receive_id_type=user_id" \
            -o response.json

          # 仅提取 code 和 msg 用于诊断，不回显原始响应体（理论上不含 token/receive_id，
          # 但保守起见只打印业务字段，避免任何可能的字段意外泄露）
          CODE=$(jq -r '.code // empty' response.json)
          MSG=$(jq -r '.msg // empty' response.json)
          if [ "$CODE" != "0" ]; then
            echo "Feishu API returned non-zero code: ${CODE}, msg: ${MSG}" >&2
            exit 1
          fi
