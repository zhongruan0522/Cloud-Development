name: Check Updates

on:
  schedule:
    # 北京时间 8:00 / 12:00 / 20:00
    - cron: '0 0 * * *'
    - cron: '0 4 * * *'
    - cron: '0 12 * * *'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    env:
      # GitHub 匿名 API 按 runner 出口 IP 共享限额，公共 runner 上经常提前耗尽；
      # 所有 GitHub 版本解析必须认证，且结果显式校验，禁止 null 往下游传播。
      GH_TOKEN: ${{ github.token }}

    steps:
      # ==========================================
      # 获取上游最新版本
      # ==========================================
      # OpenCode v2 起不再发布 GitHub Release（仓库只有裸 git tag），npm 是唯一权威版本源；
      # 包名也由 v1 的 opencode-ai 更名为 @opencode/cli（仅含 2.x），版本号为纯数字。
      - name: Get OpenCode latest version
        id: opencode
        run: |
          set -euo pipefail
          LATEST=$(curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 \
            https://registry.npmjs.org/@opencode%2Fcli/latest | jq -r '.version')
          if [ -z "$LATEST" ] || [ "$LATEST" = "null" ]; then
            echo "Failed to resolve OpenCode latest version from npm" >&2
            exit 1
          fi
          echo "version=$LATEST" >> $GITHUB_OUTPUT
          echo "OpenCode latest: $LATEST"

      # OpenChamber 的 GitHub tag 带 v 前缀（如 v1.21.0），剥离后存纯版本号。
      # 与 Dockerfile pnpm 安装的 @openchamber/web 同源发布，取最新 release 即可。
      - name: Get OpenChamber latest release
        id: openchamber
        run: |
          set -euo pipefail
          LATEST=$(gh api repos/openchamber/openchamber/releases/latest --jq '.tag_name')
          if [ -z "$LATEST" ] || [ "$LATEST" = "null" ]; then
            echo "Failed to resolve OpenChamber latest release tag" >&2
            exit 1
          fi
          echo "version=${LATEST#v}" >> $GITHUB_OUTPUT
          echo "OpenChamber latest: $LATEST"

      - name: Get Codex latest release
        id: codex
        run: |
          set -euo pipefail
          LATEST=$(gh api repos/openai/codex/releases/latest --jq '.tag_name')
          if [ -z "$LATEST" ] || [ "$LATEST" = "null" ]; then
            echo "Failed to resolve Codex latest release tag" >&2
            exit 1
          fi
          # Codex 的 tag 格式为 rust-v{version}，剥离前缀
          echo "version=${LATEST#rust-v}" >> $GITHUB_OUTPUT
          echo "Codex latest: $LATEST"

      - name: Get serena-agent latest version
        id: serena
        run: |
          set -euo pipefail
          LATEST=$(curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 \
            https://pypi.org/pypi/serena-agent/json | jq -r '.info.version')
          if [ -z "$LATEST" ] || [ "$LATEST" = "null" ]; then
            echo "Failed to resolve serena-agent latest version from PyPI" >&2
            exit 1
          fi
          echo "version=${LATEST}" >> $GITHUB_OUTPUT
          echo "serena-agent latest: $LATEST"

      - name: Get Claude Code latest version
        id: claudecode
        run: |
          set -euo pipefail
          LATEST=$(curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 \
            https://registry.npmjs.org/@anthropic-ai/claude-code/latest | jq -r '.version')
          if [ -z "$LATEST" ] || [ "$LATEST" = "null" ]; then
            echo "Failed to resolve Claude Code latest version from npm" >&2
            exit 1
          fi
          echo "version=$LATEST" >> $GITHUB_OUTPUT
          echo "Claude Code latest: $LATEST"

      - name: Get codex-security latest version
        id: codexsecurity
        run: |
          set -euo pipefail
          LATEST=$(curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 \
            https://registry.npmjs.org/@openai/codex-security/latest | jq -r '.version')
          if [ -z "$LATEST" ] || [ "$LATEST" = "null" ]; then
            echo "Failed to resolve codex-security latest version from npm" >&2
            exit 1
          fi
          echo "version=$LATEST" >> $GITHUB_OUTPUT
          echo "codex-security latest: $LATEST"

      # Antigravity CLI 无 GitHub releases，版本源是官方安装清单（install.sh 内部请求的同一接口）。
      # GCS 下载链路存在 403/200 交替抖动，清单接口同样加 --retry-all-errors 兜稳。
      - name: Get Antigravity CLI latest version
        id: antigravity
        run: |
          set -euo pipefail
          LATEST=$(curl -fsSL --retry 10 --retry-all-errors --retry-delay 2 \
            https://antigravity-cli-auto-updater-974169037036.us-central1.run.app/manifests/linux_amd64.json | jq -r '.version')
          if [ -z "$LATEST" ] || [ "$LATEST" = "null" ]; then
            echo "Failed to resolve Antigravity CLI version from upstream manifest" >&2
            exit 1
          fi
          echo "version=$LATEST" >> $GITHUB_OUTPUT
          echo "Antigravity CLI latest: $LATEST"

      # ==========================================
      # 获取我们上次记录的版本（从 release body 提取）
      # ==========================================
      - name: Get our current versions
        id: local
        run: |
          set -euo pipefail
          BODY=$(gh api "repos/${{ github.repository }}/releases/latest" --jq '.body // empty')
          if [ -n "$BODY" ]; then
            LOCAL_OPENCODE=$(echo "$BODY" | grep -oP 'opencode-version=\K[^\s]+' || true)
            LOCAL_CODEX=$(echo "$BODY" | grep -oP 'codex-version=\K[^\s]+' || true)
            LOCAL_SERENA=$(echo "$BODY" | grep -oP 'serena-version=\K[^\s]+' || true)
            LOCAL_CLAUDECODE=$(echo "$BODY" | grep -oP 'claude-code-version=\K[^\s]+' || true)
            LOCAL_CODEXSECURITY=$(echo "$BODY" | grep -oP 'codex-security-version=\K[^\s]+' || true)
            LOCAL_ANTIGRAVITY=$(echo "$BODY" | grep -oP 'antigravity-version=\K[^\s]+' || true)
            LOCAL_OPENCHAMBER=$(echo "$BODY" | grep -oP 'openchamber-version=\K[^\s]+' || true)
          fi
          echo "opencode=${LOCAL_OPENCODE:-none}" >> $GITHUB_OUTPUT
          echo "codex=${LOCAL_CODEX:-none}" >> $GITHUB_OUTPUT
          echo "serena=${LOCAL_SERENA:-none}" >> $GITHUB_OUTPUT
          echo "claudecode=${LOCAL_CLAUDECODE:-none}" >> $GITHUB_OUTPUT
          echo "codexsecurity=${LOCAL_CODEXSECURITY:-none}" >> $GITHUB_OUTPUT
          echo "antigravity=${LOCAL_ANTIGRAVITY:-none}" >> $GITHUB_OUTPUT
          echo "openchamber=${LOCAL_OPENCHAMBER:-none}" >> $GITHUB_OUTPUT
          echo "Our OpenCode: ${LOCAL_OPENCODE:-none}"
          echo "Our Codex: ${LOCAL_CODEX:-none}"
          echo "Our serena-agent: ${LOCAL_SERENA:-none}"
          echo "Our Claude Code: ${LOCAL_CLAUDECODE:-none}"
          echo "Our codex-security: ${LOCAL_CODEXSECURITY:-none}"
          echo "Our Antigravity CLI: ${LOCAL_ANTIGRAVITY:-none}"
          echo "Our OpenChamber: ${LOCAL_OPENCHAMBER:-none}"

      # ==========================================
      # 比对版本，任意一个有更新就触发构建
      # 同时把"有更新"的项写入 /tmp/updates.json，供 notify step 使用
      # ==========================================
      - name: Compare versions
        id: compare
        run: |
          set -euo pipefail

          NOW_BJ=$(TZ='Asia/Shanghai' date '+%Y-%m-%d %H:%M')
          UPDATES="[]"
          HAS_UPDATE="false"

          # 比对单个应用版本；若有更新则记录到 UPDATES 数组
          # 参数: app_name  local_version  upstream_version  changelog_url
          check_update() {
            local app="$1" local_v="$2" upstream_v="$3" changelog_url="$4"
            if [ -z "$upstream_v" ] || [ "$upstream_v" = "null" ]; then
              echo "$app upstream version is empty or null; refusing to notify or trigger a build" >&2
              exit 1
            fi
            if [ "$local_v" != "$upstream_v" ]; then
              HAS_UPDATE="true"
              echo "$app needs update: $local_v -> $upstream_v"
              UPDATES=$(jq -nc \
                --argjson updates "$UPDATES" \
                --arg app "$app" \
                --arg old "$local_v" \
                --arg new "$upstream_v" \
                --arg url "$changelog_url" \
                --arg time "$NOW_BJ" \
                '$updates + [{app_name: $app, old_version: $old, new_version: $new, changelog_url: $url, time: $time}]')
            else
              echo "$app up to date: $upstream_v"
            fi
          }

          # OpenCode: 上游为 npm 纯数字版本号；历史 release 锁定值曾带 v 前缀，比对前统一剥掉
          LOCAL_OPENCODE="${{ steps.local.outputs.opencode }}"
          check_update "OpenCode" \
            "${LOCAL_OPENCODE#v}" \
            "${{ steps.opencode.outputs.version }}" \
            "https://www.npmjs.com/package/@opencode/cli/v/${{ steps.opencode.outputs.version }}"

          # Codex: 本地已剥 rust-v 前缀，URL 里补回
          check_update "Codex" \
            "${{ steps.local.outputs.codex }}" \
            "${{ steps.codex.outputs.version }}" \
            "https://github.com/openai/codex/releases/tag/rust-v${{ steps.codex.outputs.version }}"

          # serena-agent: 数据源是 PyPI，Changelog 也指向 PyPI 版本页
          check_update "serena-agent" \
            "${{ steps.local.outputs.serena }}" \
            "${{ steps.serena.outputs.version }}" \
            "https://pypi.org/project/serena-agent/${{ steps.serena.outputs.version }}/"

          # Claude Code: 官方 npm 包，Changelog 指向 GitHub 上的 CHANGELOG.md
          check_update "Claude Code" \
            "${{ steps.local.outputs.claudecode }}" \
            "${{ steps.claudecode.outputs.version }}" \
            "https://github.com/anthropics/claude-code/blob/main/CHANGELOG.md"

          # codex-security: 仅 npm 分发，GitHub tag 格式为 npm-v{version}
          check_update "codex-security" \
            "${{ steps.local.outputs.codexsecurity }}" \
            "${{ steps.codexsecurity.outputs.version }}" \
            "https://github.com/openai/codex-security/releases/tag/npm-v${{ steps.codexsecurity.outputs.version }}"

          # Antigravity CLI: 清单只暴露最新版，无 releases 页，changelog 指向产品页
          check_update "Antigravity CLI" \
            "${{ steps.local.outputs.antigravity }}" \
            "${{ steps.antigravity.outputs.version }}" \
            "https://antigravity.google/cli"

          # OpenChamber: 本地已剥 v 前缀，URL 里补回；pnpm 包与 GitHub release 同步发布
          check_update "OpenChamber" \
            "${{ steps.local.outputs.openchamber }}" \
            "${{ steps.openchamber.outputs.version }}" \
            "https://github.com/openchamber/openchamber/releases/tag/v${{ steps.openchamber.outputs.version }}"

          echo "has_update=$HAS_UPDATE" >> $GITHUB_OUTPUT

          # 把待通知项写入文件（GITHUB_OUTPUT 不适合承载 JSON 数组）
          echo "$UPDATES" > /tmp/updates.json
          # 这道边界校验专门防止限流/响应结构漂移再次把字符串 null 发进飞书卡片。
          jq -e 'type == "array" and all(.[]; (.new_version | type == "string") and (.new_version != "") and (.new_version != "null"))' /tmp/updates.json >/dev/null
          echo "Updates to notify:"
          jq '.' /tmp/updates.json

      - name: Generate GitHub App token
        # 用 GitHub App installation token 而非默认 GITHUB_TOKEN 派发 workflow_dispatch。
        # 由 GITHUB_TOKEN 派发的 run，其完成时派发的 workflow_run 事件会被 GHA 防递归机制抑制，
        # 导致 notify.yml 收不到动态层构建完成通知；改用 App token 可正常派发事件。
        id: app-token
        if: steps.compare.outputs.has_update == 'true'
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.GH_APP_CLIENT_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          # 仅授权派发 workflow_dispatch 所需的最小权限
          permission-actions: write

      - name: Trigger build
        # Antigravity CLI 不传版本入参：上游清单只暴露最新版、无法锁定历史版本，
        # docker-build.yml 构建前自行实时查询清单取最新版并写入 release 标记。
        if: steps.compare.outputs.has_update == 'true'
        uses: actions/github-script@v8
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'docker-build.yml',
              ref: 'main',
              inputs: {
                opencode_version: '${{ steps.opencode.outputs.version }}',
                codex_version: '${{ steps.codex.outputs.version }}',
                serena_version: '${{ steps.serena.outputs.version }}',
                claude_code_version: '${{ steps.claudecode.outputs.version }}',
                codex_security_version: '${{ steps.codexsecurity.outputs.version }}',
                openchamber_version: '${{ steps.openchamber.outputs.version }}'
              }
            });

      # ==========================================
      # 通知飞书：每个有更新的 app 发一张卡片
      # 放在 Trigger build 之后，并用 if: always()
      # 这样即使 trigger 派发失败也能收到"发现新版本"通知，不被互相阻塞
      # ==========================================
      - name: Notify Feishu per update
        if: always() && steps.compare.outputs.has_update == 'true'
        env:
          APP_ID: ${{ secrets.FEISHU_APP_ID }}
          APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          USER_ID: ${{ secrets.FEISHU_USER_ID }}
        run: |
          set -euo pipefail

          # 1. 获取 tenant_access_token（沿用 notify.yml 模式：不 -f，需读 code/msg 定位错误）
          curl -sS -X POST \
            -H 'Content-Type: application/json' \
            -d "{\"app_id\":\"${APP_ID}\",\"app_secret\":\"${APP_SECRET}\"}" \
            https://open.feishu.cn/open-apis/auth/v3/tenant_access_token/internal \
            -o token_response.json

          TOKEN=$(jq -r '.tenant_access_token // empty' token_response.json)
          if [ -z "$TOKEN" ]; then
            CODE=$(jq -r '.code // empty' token_response.json)
            MSG=$(jq -r '.msg // empty' token_response.json)
            echo "Failed to fetch tenant_access_token. code=${CODE}, msg=${MSG}" >&2
            exit 1
          fi
          # 先 mask 再写 output，避免打印阶段泄露
          echo "::add-mask::${TOKEN}"

          # 2. 逐条发送通知
          COUNT=$(jq 'length' /tmp/updates.json)
          echo "Sending ${COUNT} update notification(s)..."

          for i in $(seq 0 $((COUNT - 1))); do
            APP_NAME=$(jq -r ".[$i].app_name" /tmp/updates.json)
            OLD_VERSION=$(jq -r ".[$i].old_version" /tmp/updates.json)
            NEW_VERSION=$(jq -r ".[$i].new_version" /tmp/updates.json)
            CHANGELOG_URL=$(jq -r ".[$i].changelog_url" /tmp/updates.json)
            TIME=$(jq -r ".[$i].time" /tmp/updates.json)

            # 卡片 content：序列化后的 JSON 字符串
            CONTENT=$(jq -nc \
              --arg template_id "AAqv2jtyQI8ay" \
              --arg app_name "$APP_NAME" \
              --arg old_version "$OLD_VERSION" \
              --arg new_version "$NEW_VERSION" \
              --arg changelog_url "$CHANGELOG_URL" \
              --arg time "$TIME" \
              '{
                type: "template",
                data: {
                  template_id: $template_id,
                  template_version_name: "1.0.7",
                  template_variable: {
                    App_Name: $app_name,
                    Old_Version: $old_version,
                    New_Version: $new_version,
                    Changelog_URL: $changelog_url,
                    Time: $time
                  }
                }
              }')

            # 外层请求体；所有字段经 jq 拼装，不出现在命令行回显
            PAYLOAD=$(jq -nc \
              --arg receive_id "$USER_ID" \
              --arg content "$CONTENT" \
              '{receive_id: $receive_id, msg_type: "interactive", content: $content}')

            # 版本号本身是公开信息，可打印以便追踪；USER_ID/TOKEN 不出现在 echo 中
            echo "Notifying ${APP_NAME}: ${OLD_VERSION} -> ${NEW_VERSION}"

            # 不 -f：业务错误返回 HTTP 400 + JSON body，需要读 code/msg
            echo "$PAYLOAD" | curl -sS -X POST \
              -H 'Content-Type: application/json; charset=utf-8' \
              -H "Authorization: Bearer ${TOKEN}" \
              --data-binary @- \
              "https://open.feishu.cn/open-apis/im/v1/messages?receive_id_type=user_id" \
              -o response.json

            CODE=$(jq -r '.code // empty' response.json)
            MSG=$(jq -r '.msg // empty' response.json)
            if [ "$CODE" != "0" ]; then
              echo "Feishu API returned non-zero code for ${APP_NAME}: code=${CODE}, msg=${MSG}" >&2
              exit 1
            fi
          done
