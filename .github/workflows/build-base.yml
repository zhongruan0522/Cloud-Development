name: Build Base Image

on:
  push:
    branches:
      - main
    paths:
      - 'Dockerfile.base'
      - 'base/**'
  pull_request:
    branches:
      - main
    paths:
      - 'Dockerfile.base'
      - 'base/**'
  schedule:
    # 每周一北京时间 04:00 (UTC 周日 20:00)
    - cron: '0 20 * * 0'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build-base:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
      digest: ${{ steps.build-base.outputs.digest }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Free runner disk space
        run: |
          AVAIL_GB=$(df -BG --output=avail / | awk 'NR == 2 { gsub(/G/, ""); print }')
          echo "Available disk space: ${AVAIL_GB}GB"
          if [ "${AVAIL_GB}" -lt 40 ]; then
            sudo rm -rf \
              /usr/share/dotnet \
              /usr/local/lib/android \
              /opt/ghc \
              /usr/local/share/boost \
              /opt/hostedtoolcache/CodeQL
            docker system prune -af --volumes
          else
            echo "Disk space is sufficient; skipping cleanup."
          fi
          df -h

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          cleanup: false

      - name: Log in to Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract lowercased image name
        id: meta
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ github.repository }}"
          echo "image=$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Build and push base image
        id: build-base
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.base
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.image }}:base
          # 下游层通过 FROM :base 直接获得远程镜像层；生产路径统一使用共享的
          # registry cache 标签，仅缓存最终链路（mode=min）。
          cache-from: "${{
            github.event_name != 'pull_request' &&
            format('type=registry,ref={0}:buildcache-base', steps.meta.outputs.image) ||
            'type=gha'
            }}"
          cache-to: "${{
            github.event_name != 'pull_request' &&
            format('type=registry,ref={0}:buildcache-base,mode=min', steps.meta.outputs.image) ||
            'type=gha,mode=min'
            }}"

  trigger-dynamic:
    if: github.event_name != 'pull_request'
    needs: build-base
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read

    steps:
      - name: Resolve pinned dynamic versions
        id: versions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BODY=$(gh api "repos/${{ github.repository }}/releases/latest" --jq '.body // empty')
          OPENCODE_VERSION=$(echo "$BODY" | grep -oP 'opencode-version=\K[^\s]+' || true)
          CODEX_VERSION=$(echo "$BODY" | grep -oP 'codex-version=\K[^\s]+' || true)
          # Claude Code 版本锁定在 Dockerfile 的 ARG CLAUDE_CODE_VERSION，级联派发不传其版本。
          # CLAUDE_CODE_VERSION=$(echo "$BODY" | grep -oP 'claude-code-version=\K[^\s]+' || true)
          CODEX_SECURITY_VERSION=$(echo "$BODY" | grep -oP 'codex-security-version=\K[^\s]+' || true)
          OPENCHAMBER_VERSION=$(echo "$BODY" | grep -oP 'openchamber-version=\K[^\s]+' || true)

          # codex / codex-security 首次打包前 release body 尚无锁定标记；
          # 与 docker-build.yml resolve 的引导模式一致：缺失时实时查上游最新版，
          # 既完成本次派发，也随本次动态层 release 补写标记。
          if [ -z "$CODEX_VERSION" ]; then
            CODEX_VERSION=$(gh api repos/openai/codex/releases/latest --jq '.tag_name' | sed 's/^rust-v//;s/^v//')
          fi
          if [ -z "$CODEX_SECURITY_VERSION" ]; then
            CODEX_SECURITY_VERSION=$(curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 \
              https://registry.npmjs.org/@openai%2Fcodex-security/latest | jq -r '.version')
          fi

          # [ -z "$CLAUDE_CODE_VERSION" ] ||
          if [ -z "$OPENCODE_VERSION" ] || [ -z "$CODEX_VERSION" ] || [ -z "$CODEX_SECURITY_VERSION" ] || [ -z "$OPENCHAMBER_VERSION" ]; then
            echo "Failed to resolve pinned dynamic versions from latest release body" >&2
            exit 1
          fi

          echo "opencode_version=$OPENCODE_VERSION" >> $GITHUB_OUTPUT
          echo "codex_version=$CODEX_VERSION" >> $GITHUB_OUTPUT
          # echo "claude_code_version=$CLAUDE_CODE_VERSION" >> $GITHUB_OUTPUT
          echo "codex_security_version=$CODEX_SECURITY_VERSION" >> $GITHUB_OUTPUT
          echo "openchamber_version=$OPENCHAMBER_VERSION" >> $GITHUB_OUTPUT

      - name: Generate GitHub App token
        # 用 GitHub App installation token 而非默认 GITHUB_TOKEN 派发 workflow_dispatch。
        # 由 GITHUB_TOKEN 派发的 run，其完成时派发的 workflow_run 事件会被 GHA 防递归机制抑制，
        # 导致 notify.yml 收不到下游构建完成通知；改用 App token 可正常派发事件。
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.GH_APP_CLIENT_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          # 仅授权派发 workflow_dispatch 所需的最小权限
          permission-actions: write

      - name: Trigger dynamic layer build
        uses: actions/github-script@v8
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const baseImage = process.env.BASE_IMAGE;
            if (!baseImage.includes('@sha256:')) {
              throw new Error(`Base image digest was not produced: ${baseImage}`);
            }
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'docker-build.yml',
              ref: 'main',
              inputs: {
                base_image: baseImage,
                opencode_version: '${{ steps.versions.outputs.opencode_version }}',
                codex_version: '${{ steps.versions.outputs.codex_version }}',
                // claude_code_version: '${{ steps.versions.outputs.claude_code_version }}',
                codex_security_version: '${{ steps.versions.outputs.codex_security_version }}',
                openchamber_version: '${{ steps.versions.outputs.openchamber_version }}'
              }
            });
        env:
          BASE_IMAGE: ${{ needs.build-base.outputs.image }}@${{ needs.build-base.outputs.digest }}
