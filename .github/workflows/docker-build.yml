name: Build and Push Docker Image

on:
  push:
    branches:
      - main
    paths:
      - 'Dockerfile'
      - 'agent/**'
  pull_request:
    branches:
      - main
    paths:
      - 'Dockerfile'
      - 'agent/**'
  workflow_dispatch:
    inputs:
      base_image:
        description: 'Exact Base image reference (repository:base@sha256:digest) for the slim variant. Leave empty to fall back to the :base tag.'
        required: false
        default: ''
        type: string
      desktop_image:
        description: 'Exact Desktop image reference (repository:desktop@sha256:digest)'
        required: false
        default: ''
        type: string
      opencode_version:
        description: 'OpenCode v2 version from npm @opencode/cli (e.g. 2.0.19 or v2.0.19). Leave empty to reuse saved release version.'
        required: false
        default: ''
        type: string
      codex_version:
        description: 'Codex CLI version (e.g. 0.122.0, v0.122.0, or rust-v0.122.0). Leave empty to reuse saved release version.'
        required: false
        default: ''
        type: string
      serena_version:
        description: 'serena-agent version (e.g. 0.1.0). Leave empty to reuse saved release version.'
        required: false
        default: ''
        type: string
      claude_code_version:
        description: 'Claude Code version (e.g. 2.1.220 or v2.1.220). Leave empty to reuse saved release version.'
        required: false
        default: ''
        type: string
      codex_security_version:
        description: 'codex-security version (e.g. 0.1.12). Leave empty to reuse saved release version.'
        required: false
        default: ''
        type: string
      openchamber_version:
        description: 'OpenChamber version (e.g. 1.21.0 or v1.21.0). Leave empty to reuse saved release version.'
        required: false
        default: ''
        type: string
      force_package:
        description: 'Force packaging (mint release tag) even with no cascade image / pinned versions / component update.'
        required: false
        default: false
        type: boolean

env:
  REGISTRY: ghcr.io

jobs:
  changes:
    # 跨层同 push 竞态保护：若本次 push 同时改动了 Base/桌面层归属文件，
    # 则跳过本 workflow 的 push 直接触发，由底层构建完成后的级联按序重建，
    # 避免 FROM :desktop 时下层镜像尚未推送而报 not found。
    # workflow_dispatch（含级联派发）不走此判断：派发时下层镜像必已推送。
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check if lower layers changed in this push
        id: check
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          # push 事件必带 before（分支前一 tip）；为零值/不可达时 diff 直接报错，不做兜底
          CHANGED=$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}")
          echo "Files changed in this push:"
          echo "$CHANGED"
          # Base 层 + 桌面层归属路径（上层镜像 FROM 它们，同 push 变动即存在竞态）
          LOWER_RE='^(Dockerfile\.base|base/|Dockerfile\.desktop|desktop/)'
          if printf '%s\n' "$CHANGED" | grep -qE "$LOWER_RE"; then
            echo "Lower-layer files changed in same push; skip direct trigger, cascade will rebuild."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Non-push events never skip
        if: github.event_name != 'push'
        run: echo "skip=false" >> "$GITHUB_OUTPUT"

  resolve:
    # 版本解析唯一入口：结果通过 job outputs 同时供 build-slim / build-desktop
    # 两个并行构建 job 复用，保证双变体版本严格一致、脚本只维护一份。
    name: Resolve component versions
    needs: changes
    if: needs.changes.outputs.skip != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      opencode_version: ${{ steps.version.outputs.opencode_version }}
      codex_version: ${{ steps.version.outputs.codex_version }}
      serena_version: ${{ steps.version.outputs.serena_version }}
      claude_code_version: ${{ steps.version.outputs.claude_code_version }}
      codex_security_version: ${{ steps.version.outputs.codex_security_version }}
      antigravity_version: ${{ steps.version.outputs.antigravity_version }}
      openchamber_version: ${{ steps.version.outputs.openchamber_version }}
      release_tag: ${{ steps.version.outputs.release_tag }}
      package: ${{ steps.version.outputs.package }}
    steps:

      - name: Resolve versions
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_OPENCODE_VERSION: ${{ inputs.opencode_version }}
          INPUT_CODEX_VERSION: ${{ inputs.codex_version }}
          INPUT_SERENA_VERSION: ${{ inputs.serena_version }}
          INPUT_CLAUDE_CODE_VERSION: ${{ inputs.claude_code_version }}
          INPUT_CODEX_SECURITY_VERSION: ${{ inputs.codex_security_version }}
          INPUT_OPENCHAMBER_VERSION: ${{ inputs.openchamber_version }}
          INPUT_BASE_IMAGE: ${{ inputs.base_image }}
          INPUT_DESKTOP_IMAGE: ${{ inputs.desktop_image }}
          FORCE_PACKAGE: ${{ inputs.force_package }}
        run: |
          set -euo pipefail

          # workflow_dispatch 的缺失输入可能被表达式渲染为字符串 "null"。
          # 这里统一归一化为空串，让后续“入参 → release 锁定值 → 上游实时值”正常回退。
          for input_var in \
            INPUT_OPENCODE_VERSION \
            INPUT_CODEX_VERSION \
            INPUT_SERENA_VERSION \
            INPUT_CLAUDE_CODE_VERSION \
            INPUT_CODEX_SECURITY_VERSION \
            INPUT_OPENCHAMBER_VERSION \
            INPUT_BASE_IMAGE \
            INPUT_DESKTOP_IMAGE; do
            if [ "${!input_var:-}" = "null" ]; then
              printf -v "$input_var" ''
            fi
          done

          # --- 打包闸门与发行 tag ---
          # 发行 tag 为北京日期 Calver（vYYYY.MM.DD），与任何单一组件版本解耦；
          # 同日多次构建直接覆盖同名 tag 与 release，不追加 .1/.2 序号。
          # 仅在存在真实变更时才打包（产出镜像 tag + release）：
          #   - push：paths 白名单已限定 Dockerfile/agent/**，动态层内容必变，恒打包；
          #   - pull_request：恒打包，但 push=false 只做构建验证，release job 按事件自拦；
          #   - workflow_dispatch：携带下层镜像摘要（base/desktop 级联）、任一组件版本入参、
          #     或显式 force_package 才打包；裸派发（无任何入参）不产出新版本，整体跳过。
          PACKAGE="true"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${FORCE_PACKAGE:-false}" != "true" ] \
              && [ -z "${INPUT_BASE_IMAGE:-}" ] \
              && [ -z "${INPUT_DESKTOP_IMAGE:-}" ] \
              && [ -z "${INPUT_OPENCODE_VERSION:-}" ] \
              && [ -z "${INPUT_CODEX_VERSION:-}" ] \
              && [ -z "${INPUT_SERENA_VERSION:-}" ] \
              && [ -z "${INPUT_CLAUDE_CODE_VERSION:-}" ] \
              && [ -z "${INPUT_CODEX_SECURITY_VERSION:-}" ] \
              && [ -z "${INPUT_OPENCHAMBER_VERSION:-}" ]; then
              echo "No component update, no cascade image, force_package unset; skip packaging."
              echo "package=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "package=$PACKAGE" >> "$GITHUB_OUTPUT"

          RELEASE_TAG="v$(TZ='Asia/Shanghai' date +%Y.%m.%d)"
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

          # --- 版本解析统一框架 ---
          # 各组件的 tag 前缀剥离规则不同（GitHub tag 格式差异），统一收敛到一处声明：
          #   <组件名>|<输入变量名>|<release 标记名>|<tag 专属前缀(可空)>
          # 剥离规则统一为：先剥组件专属前缀（rust-v / npm-v 等），再剥裸 v 前缀。
          # 输出统一命名：<组件名>_version（纯版本号）。
          COMPONENTS=(
            "opencode|INPUT_OPENCODE_VERSION|opencode-version|"
            "codex|INPUT_CODEX_VERSION|codex-version|rust-v"
            "serena|INPUT_SERENA_VERSION|serena-version|"
            "claude_code|INPUT_CLAUDE_CODE_VERSION|claude-code-version|"
            "codex_security|INPUT_CODEX_SECURITY_VERSION|codex-security-version|npm-v"
          )

          # 任一组件未提供输入时，从 latest release body 提取全部锁定版本
          NEED_SAVED=0
          for comp in "${COMPONENTS[@]}"; do
            IFS='|' read -r _ in_var _rest <<<"$comp"
            raw_input="${!in_var:-}"
            if [ -z "$raw_input" ] || [ "$raw_input" = "null" ]; then NEED_SAVED=1; break; fi
          done
          if [ "$NEED_SAVED" -eq 1 ]; then
            BODY=$(gh api "repos/${{ github.repository }}/releases/latest" --jq '.body // empty')
          fi

          for comp in "${COMPONENTS[@]}"; do
            IFS='|' read -r name in_var mark custom_prefix <<<"$comp"

            ver="${!in_var:-}"
            if [ "$ver" = "null" ]; then ver=""; fi
            if [ -z "$ver" ]; then
              ver=$(printf '%s' "${BODY:-}" | grep -oP "${mark}=\K[^\s]+" || true)
              if [ -z "$ver" ]; then
                echo "$name version was not provided and no saved release version was found" >&2
                exit 1
              fi
            fi

            # 统一剥离：组件专属前缀 → 裸 v 前缀（幂等，无前缀时为空操作）
            if [ -n "$custom_prefix" ]; then ver="${ver#"$custom_prefix"}"; fi
            ver="${ver#v}"

            echo "$name: $ver"
            echo "${name}_version=$ver" >> "$GITHUB_OUTPUT"
          done

          # --- OpenChamber 版本 ---
          # 与 Antigravity 同模式：首个版本构建时 release body 里还没有 openchamber-version
          # 锁定标记（标记由本 workflow 首次成功后才写入），push/级联触发又没有入参，
          # 若只依赖"入参→锁定值"会陷入鸡生蛋死锁。因此未提供入参时实时查上游
          # GitHub releases 最新版：既作为缓存 key 传给 Dockerfile，也写入 release 标记。
          OPENCHAMBER_VERSION="${INPUT_OPENCHAMBER_VERSION:-}"
          if [ "$OPENCHAMBER_VERSION" = "null" ]; then OPENCHAMBER_VERSION=""; fi
          if [ -z "$OPENCHAMBER_VERSION" ]; then
            OPENCHAMBER_VERSION=$(printf '%s' "${BODY:-}" | grep -oP 'openchamber-version=\K[^\s]+' || true)
          fi
          if [ -z "$OPENCHAMBER_VERSION" ]; then
            OPENCHAMBER_VERSION=$(gh api repos/openchamber/openchamber/releases/latest --jq '.tag_name' | sed 's/^v//')
          fi
          if [ -z "$OPENCHAMBER_VERSION" ] || [ "$OPENCHAMBER_VERSION" = "null" ]; then
            echo "OpenChamber version was not resolved from input, saved release, or upstream releases" >&2
            exit 1
          fi
          echo "openchamber: $OPENCHAMBER_VERSION"
          echo "openchamber_version=$OPENCHAMBER_VERSION" >> "$GITHUB_OUTPUT"

          # --- Antigravity CLI 版本 ---
          # 上游清单永远只暴露最新版（无历史版本可锁），因此不设 workflow_dispatch 入参、
          # 也不读 release 锁定值，每次构建实时查清单：取到的版本既写入 release 标记，
          # 也作为 ARG 传给 Dockerfile 充当缓存 key（agy 升级时使其安装层失效重建）。
          ANTIGRAVITY_VERSION=$(curl -fsSL --retry 10 --retry-all-errors --retry-delay 2 \
            https://antigravity-cli-auto-updater-974169037036.us-central1.run.app/manifests/linux_amd64.json | jq -r '.version')
          if [ -z "$ANTIGRAVITY_VERSION" ] || [ "$ANTIGRAVITY_VERSION" = "null" ]; then
            echo "Antigravity CLI version was not resolved from upstream manifest" >&2
            exit 1
          fi
          echo "Antigravity CLI: $ANTIGRAVITY_VERSION"
          echo "antigravity_version=$ANTIGRAVITY_VERSION" >> $GITHUB_OUTPUT

  build-slim:
    # slim 变体（NoDesktop-Base）：FROM :base，产出默认无后缀 tag vYYYY.MM.DD（Calver）。
    # 与 build-desktop 并行构建（各自独立 runner），互不占用对方的构建时间。
    name: Build slim variant (NoDesktop-Base)
    needs: [changes, resolve]
    if: needs.changes.outputs.skip != 'true' && needs.resolve.outputs.package == 'true'
    runs-on: ubuntu-latest
    permissions:
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Free runner disk space
        run: |
          AVAIL_GB=$(df -BG --output=avail / | awk 'NR == 2 { gsub(/G/, ""); print }')
          echo "Available disk space: ${AVAIL_GB}GB"
          if [ "${AVAIL_GB}" -lt 40 ]; then
            sudo rm -rf \
              /usr/share/dotnet \
              /usr/local/lib/android \
              /opt/ghc \
              /usr/local/share/boost \
              /opt/hostedtoolcache/CodeQL
            docker system prune -af --volumes
          else
            echo "Disk space is sufficient; skipping cleanup."
          fi
          df -h

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          cleanup: false

      - name: Log in to Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract lowercased cache repository
        id: cache_repo
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ github.repository }}"
          echo "image=$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}
          tags: |
            type=ref,event=pr
            type=raw,value=${{ needs.resolve.outputs.release_tag }},enable=${{ github.event_name != 'pull_request' }}

      - name: Resolve Base image reference
        id: parent_image
        env:
          CASCADE_BASE_IMAGE: ${{ inputs.base_image }}
          IMAGE: ${{ env.REGISTRY }}/${{ github.repository }}
        run: |
          set -euo pipefail
          IMAGE=$(printf '%s' "${IMAGE}" | tr '[:upper:]' '[:lower:]')
          if [ -n "${CASCADE_BASE_IMAGE:-}" ] && [ "${CASCADE_BASE_IMAGE:-}" != "null" ]; then
            case "${CASCADE_BASE_IMAGE}" in
              *@sha256:*) IMAGE="${CASCADE_BASE_IMAGE}" ;;
              *) echo "Invalid cascade Base image reference: ${CASCADE_BASE_IMAGE}" >&2; exit 1 ;;
            esac
          else
            IMAGE="${IMAGE}:base"
          fi
          echo "Using Base image: ${IMAGE}"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"

      - name: Build and push slim image
        uses: docker/build-push-action@v7
        with:
          context: .
          build-args: |
            BASE_IMAGE=${{ steps.parent_image.outputs.image }}
            OPENCODE_VERSION=${{ needs.resolve.outputs.opencode_version }}
            CODEX_VERSION=${{ needs.resolve.outputs.codex_version }}
            SERENA_VERSION=${{ needs.resolve.outputs.serena_version }}
            CLAUDE_CODE_VERSION=${{ needs.resolve.outputs.claude_code_version }}
            CODEX_SECURITY_VERSION=${{ needs.resolve.outputs.codex_security_version }}
            ANTIGRAVITY_VERSION=${{ needs.resolve.outputs.antigravity_version }}
            OPENCHAMBER_VERSION=${{ needs.resolve.outputs.openchamber_version }}
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # slim 变体用独立 buildcache-dynamic-slim 缓存标签：FROM 链与 desktop
          # 变体不同，缓存互不可复用；分开存取避免互相污染命中。
          cache-from: "${{
            github.event_name != 'pull_request' &&
            format('type=registry,ref={0}:buildcache-dynamic-slim', steps.cache_repo.outputs.image) ||
            'type=gha'
            }}"
          cache-to: "${{
            github.event_name != 'pull_request' &&
            format('type=registry,ref={0}:buildcache-dynamic-slim,mode=min', steps.cache_repo.outputs.image) ||
            'type=gha,mode=min'
            }}"

  build-desktop:
    # desktop 变体（Desktop-Base）：FROM :desktop，产出 vYYYY.MM.DD-desktop（Calver）。
    # 沿用原 buildcache-dynamic 缓存标签：历史缓存正是 FROM :desktop 的链路，无缝续用。
    name: Build desktop variant (Desktop-Base)
    needs: [changes, resolve]
    if: needs.changes.outputs.skip != 'true' && needs.resolve.outputs.package == 'true'
    runs-on: ubuntu-latest
    permissions:
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Free runner disk space
        run: |
          AVAIL_GB=$(df -BG --output=avail / | awk 'NR == 2 { gsub(/G/, ""); print }')
          echo "Available disk space: ${AVAIL_GB}GB"
          if [ "${AVAIL_GB}" -lt 40 ]; then
            sudo rm -rf \
              /usr/share/dotnet \
              /usr/local/lib/android \
              /opt/ghc \
              /usr/local/share/boost \
              /opt/hostedtoolcache/CodeQL
            docker system prune -af --volumes
          else
            echo "Disk space is sufficient; skipping cleanup."
          fi
          df -h

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          cleanup: false

      - name: Log in to Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract lowercased cache repository
        id: cache_repo
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ github.repository }}"
          echo "image=$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}
          # flavor suffix 统一为全部 tag 加 -desktop 后缀：pr-N → pr-N-desktop，vYYYY.MM.DD → vYYYY.MM.DD-desktop
          flavor: |
            suffix=-desktop,onlatest=true
          tags: |
            type=ref,event=pr
            type=raw,value=${{ needs.resolve.outputs.release_tag }},enable=${{ github.event_name != 'pull_request' }}

      - name: Resolve Desktop image reference
        id: parent_image
        env:
          CASCADE_DESKTOP_IMAGE: ${{ inputs.desktop_image }}
          IMAGE: ${{ env.REGISTRY }}/${{ github.repository }}
        run: |
          set -euo pipefail
          IMAGE=$(printf '%s' "${IMAGE}" | tr '[:upper:]' '[:lower:]')
          if [ -n "${CASCADE_DESKTOP_IMAGE:-}" ] && [ "${CASCADE_DESKTOP_IMAGE:-}" != "null" ]; then
            case "${CASCADE_DESKTOP_IMAGE}" in
              *@sha256:*) IMAGE="${CASCADE_DESKTOP_IMAGE}" ;;
              *) echo "Invalid cascade Desktop image reference: ${CASCADE_DESKTOP_IMAGE}" >&2; exit 1 ;;
            esac
          else
            IMAGE="${IMAGE}:desktop"
          fi
          echo "Using Desktop image: ${IMAGE}"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"

      - name: Build and push desktop image
        uses: docker/build-push-action@v7
        with:
          context: .
          build-args: |
            BASE_IMAGE=${{ steps.parent_image.outputs.image }}
            OPENCODE_VERSION=${{ needs.resolve.outputs.opencode_version }}
            CODEX_VERSION=${{ needs.resolve.outputs.codex_version }}
            SERENA_VERSION=${{ needs.resolve.outputs.serena_version }}
            CLAUDE_CODE_VERSION=${{ needs.resolve.outputs.claude_code_version }}
            CODEX_SECURITY_VERSION=${{ needs.resolve.outputs.codex_security_version }}
            ANTIGRAVITY_VERSION=${{ needs.resolve.outputs.antigravity_version }}
            OPENCHAMBER_VERSION=${{ needs.resolve.outputs.openchamber_version }}
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Dynamic 层同理使用共享 registry cache，避免再向独立的 GHA scope
          # 复制 Base/Desktop 已上传过的多层链镜像内容。
          cache-from: "${{
            github.event_name != 'pull_request' &&
            format('type=registry,ref={0}:buildcache-dynamic', steps.cache_repo.outputs.image) ||
            'type=gha'
            }}"
          cache-to: "${{
            github.event_name != 'pull_request' &&
            format('type=registry,ref={0}:buildcache-dynamic,mode=min', steps.cache_repo.outputs.image) ||
            'type=gha,mode=min'
            }}"

  release:
    # 双变体镜像（slim + desktop）全部推送成功后再写版本锁；任一变体构建失败时
    # 本 job 会被 needs 链直接跳过，避免 Check Updates 把未成功打包的版本
    # 误判为“本地已构建”，破坏自动更新状态机。打包闸门（package=false）放空的
    # 无更新运行同样在此被跳过，不产出 release。
    name: Create or update GitHub Release
    needs: [changes, resolve, build-slim, build-desktop]
    if: github.event_name != 'pull_request' && needs.changes.outputs.skip != 'true' && needs.resolve.outputs.package == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.resolve.outputs.release_tag }}
          name: ${{ needs.resolve.outputs.release_tag }}
          body: |
            发行 tag 为北京日期 Calver（vYYYY.MM.DD），与组件版本解耦；同日多次构建覆盖同 tag。

            ## 内置 Agent

            - [OpenCode ${{ needs.resolve.outputs.opencode_version }}](https://www.npmjs.com/package/@opencode/cli/v/${{ needs.resolve.outputs.opencode_version }})
            - [Codex ${{ needs.resolve.outputs.codex_version }}](https://github.com/openai/codex/releases/tag/rust-v${{ needs.resolve.outputs.codex_version }})
            - [Claude Code ${{ needs.resolve.outputs.claude_code_version }}](https://github.com/anthropics/claude-code/blob/main/CHANGELOG.md)
            - [serena-agent ${{ needs.resolve.outputs.serena_version }}](https://pypi.org/project/serena-agent/${{ needs.resolve.outputs.serena_version }}/)
            - [Antigravity CLI ${{ needs.resolve.outputs.antigravity_version }}](https://antigravity.google/cli)

            <!-- 版本标记（供自动更新检查读取，请勿删除） -->
            <!-- opencode-version=${{ needs.resolve.outputs.opencode_version }} -->
            <!-- codex-version=${{ needs.resolve.outputs.codex_version }} -->
            <!-- serena-version=${{ needs.resolve.outputs.serena_version }} -->
            <!-- claude-code-version=${{ needs.resolve.outputs.claude_code_version }} -->
            <!-- codex-security-version=${{ needs.resolve.outputs.codex_security_version }} -->
            <!-- antigravity-version=${{ needs.resolve.outputs.antigravity_version }} -->
            <!-- openchamber-version=${{ needs.resolve.outputs.openchamber_version }} -->
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
