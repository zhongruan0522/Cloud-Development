name: Build Desktop Image

on:
  push:
    branches:
      - main
    paths:
      - 'Dockerfile.desktop'
      - 'desktop/**'
  pull_request:
    branches:
      - main
    paths:
      - 'Dockerfile.desktop'
      - 'desktop/**'
  workflow_dispatch:
    inputs:
      base_image:
        description: 'Exact Base image reference (repository:base@sha256:digest)'
        required: false
        default: ''
        type: string

env:
  REGISTRY: ghcr.io

jobs:
  changes:
    # 跨层同 push 竞态保护：若本次 push 同时改动了 Base 层归属文件，
    # 则跳过本 workflow 的 push 直接触发，由 Base 构建完成后的 trigger-desktop
    # 级联按序重建，避免 FROM :base 时 Base 镜像尚未推送（tags 更新滞后）。
    # workflow_dispatch（含级联派发）不走此判断：派发时 Base 必已推送完成。
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check if base layer changed in this push
        id: check
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          # push 事件必带 before（分支前一 tip）；为零值/不可达时 diff 直接报错，不做兜底
          CHANGED=$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}")
          echo "Files changed in this push:"
          echo "$CHANGED"
          # Base 层归属路径（桌面层 FROM :base，同 push 变动即存在竞态）
          BASE_RE='^(Dockerfile\.base|base/)'
          if printf '%s\n' "$CHANGED" | grep -qE "$BASE_RE"; then
            echo "Base-layer files changed in same push; skip direct trigger, cascade will rebuild."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Non-push events never skip
        if: github.event_name != 'push'
        run: echo "skip=false" >> "$GITHUB_OUTPUT"

  build-desktop:
    needs: changes
    if: needs.changes.outputs.skip != 'true'
    runs-on: ubuntu-latest
    permissions:
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
      digest: ${{ steps.build-desktop.outputs.digest }}
      # 本 job 实际使用的 Base 引用：级联时为 digest 精确引用，直接触发时为 :base tag。
      # 供 trigger-dynamic 透传给动态层 slim 变体（仅 digest 形式才透传）。
      base_image: ${{ steps.base_image.outputs.image }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Free runner disk space
        run: |
          AVAIL_GB=$(df -BG --output=avail / | awk 'NR == 2 { gsub(/G/, ""); print }')
          echo "Available disk space: ${AVAIL_GB}GB"
          if [ "${AVAIL_GB}" -lt 40 ]; then
            sudo rm -rf \
              /usr/share/dotnet \
              /usr/local/lib/android \
              /opt/ghc \
              /usr/local/share/boost \
              /opt/hostedtoolcache/CodeQL
            docker system prune -af --volumes
          else
            echo "Disk space is sufficient; skipping cleanup."
          fi
          df -h

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          cleanup: false

      - name: Log in to Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract lowercased image name
        id: meta
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ github.repository }}"
          echo "image=$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Resolve Base image reference
        id: base_image
        env:
          CASCADE_BASE_IMAGE: ${{ inputs.base_image }}
          IMAGE: ${{ steps.meta.outputs.image }}
        run: |
          set -euo pipefail
          if [ -n "${CASCADE_BASE_IMAGE:-}" ] && [ "${CASCADE_BASE_IMAGE:-}" != "null" ]; then
            case "${CASCADE_BASE_IMAGE}" in
              *@sha256:*) IMAGE="${CASCADE_BASE_IMAGE}" ;;
              *) echo "Invalid cascade Base image reference: ${CASCADE_BASE_IMAGE}" >&2; exit 1 ;;
            esac
          else
            IMAGE="${IMAGE}:base"
          fi
          echo "Using Base image: ${IMAGE}"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"

      - name: Build and push desktop image
        id: build-desktop
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.desktop
          build-args: |
            BASE_IMAGE=${{ steps.base_image.outputs.image }}
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.image }}:desktop
          # 与 Base/Dynamic 使用同一套 content-addressable registry storage；
          # 共享 buildcache 标签可避免 workflow 级 GHA cache scope 重复上传下层大层。
          cache-from: "${{
            github.event_name != 'pull_request' &&
            format('type=registry,ref={0}:buildcache-desktop', steps.meta.outputs.image) ||
            'type=gha'
            }}"
          cache-to: "${{
            github.event_name != 'pull_request' &&
            format('type=registry,ref={0}:buildcache-desktop,mode=min', steps.meta.outputs.image) ||
            'type=gha,mode=min'
            }}"

  trigger-dynamic:
    if: github.event_name != 'pull_request' && needs.changes.outputs.skip != 'true'
    needs: [changes, build-desktop]
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read

    steps:
      - name: Resolve pinned dynamic versions
        id: versions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BODY=$(gh api "repos/${{ github.repository }}/releases/latest" --jq '.body // empty')
          OPENCODE_VERSION=$(echo "$BODY" | grep -oP 'opencode-version=\K[^\s]+' || true)
          CODEX_VERSION=$(echo "$BODY" | grep -oP 'codex-version=\K[^\s]+' || true)
          SERENA_VERSION=$(echo "$BODY" | grep -oP 'serena-version=\K[^\s]+' || true)
          CLAUDE_CODE_VERSION=$(echo "$BODY" | grep -oP 'claude-code-version=\K[^\s]+' || true)
          CODEX_SECURITY_VERSION=$(echo "$BODY" | grep -oP 'codex-security-version=\K[^\s]+' || true)
          OPENCHAMBER_VERSION=$(echo "$BODY" | grep -oP 'openchamber-version=\K[^\s]+' || true)

          if [ -z "$OPENCODE_VERSION" ] || [ -z "$CODEX_VERSION" ] || [ -z "$SERENA_VERSION" ] || [ -z "$CLAUDE_CODE_VERSION" ] || [ -z "$CODEX_SECURITY_VERSION" ] || [ -z "$OPENCHAMBER_VERSION" ]; then
            echo "Failed to resolve pinned dynamic versions from latest release body" >&2
            exit 1
          fi

          echo "opencode_version=$OPENCODE_VERSION" >> $GITHUB_OUTPUT
          echo "codex_version=$CODEX_VERSION" >> $GITHUB_OUTPUT
          echo "serena_version=$SERENA_VERSION" >> $GITHUB_OUTPUT
          echo "claude_code_version=$CLAUDE_CODE_VERSION" >> $GITHUB_OUTPUT
          echo "codex_security_version=$CODEX_SECURITY_VERSION" >> $GITHUB_OUTPUT
          echo "openchamber_version=$OPENCHAMBER_VERSION" >> $GITHUB_OUTPUT

      - name: Generate GitHub App token
        # 用 GitHub App installation token 而非默认 GITHUB_TOKEN 派发 workflow_dispatch。
        # 由 GITHUB_TOKEN 派发的 run，其完成时派发的 workflow_run 事件会被 GHA 防递归机制抑制，
        # 导致 notify.yml 收不到动态层构建完成通知；改用 App token 可正常派发事件。
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.GH_APP_CLIENT_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          # 仅授权派发 workflow_dispatch 所需的最小权限
          permission-actions: write

      - name: Trigger dynamic layer build
        uses: actions/github-script@v8
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const desktopImage = process.env.DESKTOP_IMAGE;
            if (!desktopImage.includes('@sha256:')) {
              throw new Error(`Desktop image digest was not produced: ${desktopImage}`);
            }
            const inputs = {
              desktop_image: desktopImage,
              opencode_version: '${{ steps.versions.outputs.opencode_version }}',
              codex_version: '${{ steps.versions.outputs.codex_version }}',
              serena_version: '${{ steps.versions.outputs.serena_version }}',
              claude_code_version: '${{ steps.versions.outputs.claude_code_version }}',
              codex_security_version: '${{ steps.versions.outputs.codex_security_version }}',
              openchamber_version: '${{ steps.versions.outputs.openchamber_version }}'
            };
            // 仅级联路径（本 job 从 Base digest 精确引用构建）才透传 base_image，
            // 让动态层 slim 变体锚定同一 Base digest；Desktop 层单独变更时省略该入参，
            // 动态层 slim 变体回退 :base tag 并全量命中缓存零成本通过。
            const baseImage = process.env.BASE_IMAGE || '';
            if (baseImage.includes('@sha256:')) {
              inputs.base_image = baseImage;
            }
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'docker-build.yml',
              ref: 'main',
              inputs
            });
        env:
          DESKTOP_IMAGE: ${{ needs.build-desktop.outputs.image }}@${{ needs.build-desktop.outputs.digest }}
          BASE_IMAGE: ${{ needs.build-desktop.outputs.base_image }}
