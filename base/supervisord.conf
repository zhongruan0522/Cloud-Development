; 用 supervisord 托管 OpenChamber 等主服务，避免同容器多进程无人看护。
[supervisord]
nodaemon=true
logfile=/tmp/supervisord.log
pidfile=/tmp/supervisord.pid
childlogdir=/tmp

; supervisorctl 控制通道：unix socket（0700，仅 root 可连）。
; 不启用 [inet_http_server]（supervisor 自带 web 界面），减少攻击面；
; Docker HEALTHCHECK 经 supervisorctl 走本 socket，功能不变。
[unix_http_server]
file=/tmp/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

; Docker daemon（DinD 模式，数据存内存，容器重启即复原）
; 默认不自启以节省内存（~200-500 MB），通过 ENABLE_DOCKERD=1 开启开机自启，
; 或运行中手动 supervisorctl start dockerd 拉起。
[program:dockerd]
command=/usr/bin/dockerd --data-root=/tmp/docker --storage-driver=vfs --iptables=false --bridge=none
autostart=false
autorestart=true
startsecs=3
stopwaitsecs=10
stopsignal=TERM
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

; OpenChamber 是容器的主服务入口：Web UI + 托管 opencode serve 子进程，对外提供 4096 端口。
; --foreground 前台运行（配合 supervisord 托管）；监听地址由 OPENCHAMBER_HOST 控制（entrypoint 默认 0.0.0.0）。
; user=app 为占位值：entrypoint 启动时按 SSH_USER 运行期 sed 替换为实际主账号
; （root 或启动时创建的普通用户）；家目录 HOME 固定 /root，与账号名解耦。
[program:openchamber]
command=/usr/local/bin/openchamber serve --port 4096 --foreground
directory=/workspace
user=app
autostart=true
autorestart=true
startsecs=5
stopsignal=TERM
stopasgroup=true
killasgroup=true
environment=HOME="/root",USER="app",SHELL="/bin/bash",OPENCHAMBER_HOST="%(ENV_OPENCHAMBER_HOST)s",OPENCHAMBER_UI_PASSWORD="%(ENV_OPENCHAMBER_UI_PASSWORD)s"
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

; Serena MCP 常驻服务（streamable-http 模式，仅容器内 127.0.0.1:9121 可达）：
; Codex / OpenCode 等客户端全部连这一个 server，共享同一份语言服务器进程，
; 避免 stdio 模式下每个客户端会话（尤其子代理）各起一个 LSP 把内存打爆。
; 随容器自启，供容器内 MCP 客户端连接；失败由 supervisorctl / healthcheck 显式暴露。
; 项目激活：客户端内用 activate_project 指定路径即可，无需 --project-from-cwd（HTTP 模式下无意义）。
; 不同项目的并发隔离需要按官方文档为每个项目启动独立 Serena 实例。
[program:serena]
command=/usr/local/bin/serena start-mcp-server --context ide --transport streamable-http --host 127.0.0.1 --port 9121 --open-web-dashboard false
directory=/workspace
user=app
autostart=true
autorestart=true
startsecs=5
stopsignal=TERM
stopasgroup=true
killasgroup=true
environment=HOME="/root",USER="app",SHELL="/bin/bash"
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

; PostgreSQL 17 本地开发数据库（Debian pg_createcluster 布局：数据
; /var/lib/postgresql/17/main，配置 /etc/postgresql/17/main）。
; 默认不自启（空转也要占内存），通过 ENABLE_PG=1 开启开机自启（entrypoint 检测并
; 初始化空数据目录），或运行中手动 supervisorctl start postgresql 拉起。
; user=postgres 是 postgresql-17 包预建的固定系统账号（postgres 拒绝以 root 运行），
; 不参与 openchamber 的 user=app 占位符 sed 替换（该 sed 仅精确匹配 ^user=app$）。
; 监听 127.0.0.1:5432（Debian 默认），仅容器内可达；宿主机经 SSH 隧道访问。
; stopsignal=INT 必须保留：postgres 收 SIGTERM 是 smart shutdown（等所有客户端退出，
; 可能永不结束→stopwaitsecs 强杀→下次启动崩溃恢复），SIGINT 才是 fast shutdown。
[program:postgresql]
command=/usr/lib/postgresql/17/bin/postgres -D /var/lib/postgresql/17/main -c config_file=/etc/postgresql/17/main/postgresql.conf
user=postgres
autostart=false
autorestart=true
startsecs=5
stopwaitsecs=30
stopsignal=INT
stopasgroup=true
killasgroup=true
environment=HOME="/var/lib/postgresql",USER="postgres",SHELL="/bin/bash"
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

; MySQL 8.4 本地开发数据库（Debian 布局：数据 /var/lib/mysql，配置
; /etc/mysql/my.cnf → conf.d/mysqld.cnf，socket /var/run/mysqld/mysqld.sock）。
; 默认不自启（空转约 400-500 MB 内存），通过 ENABLE_MYSQL=1 开启开机自启
; （entrypoint 检测并初始化空数据目录，首启 initialize 约 10-30s），
; 或运行中手动 supervisorctl start mysql 拉起。
; user=mysql 为 mysql-community-server 包预建系统账号，同样不参与 user=app sed 替换；
; command 里的 --user=mysql 在 supervisor setuid 后为冗余双保险（非 root 运行时仅告警）。
; 监听 127.0.0.1:3306（Debian 默认 bind-address），仅容器内可达；错误日志已落 stderr。
[program:mysql]
command=/usr/sbin/mysqld --user=mysql
user=mysql
autostart=false
autorestart=true
startsecs=10
stopwaitsecs=30
stopsignal=TERM
stopasgroup=true
killasgroup=true
environment=HOME="/var/lib/mysql",USER="mysql",SHELL="/bin/bash"
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
