; 用 supervisord 托管 OpenChamber 等主服务，避免同容器多进程无人看护。
[supervisord]
nodaemon=true
; silent=true：supervisord 自身的日志（spawned / success / reaped 等）只写 logfile，
; 不镜像到容器 stdout；容器 stdout 只保留入口脚本的状态行（日志分层见 entrypoint.sh）。
silent=true
logfile=/tmp/supervisord.log
pidfile=/tmp/supervisord.pid
childlogdir=/tmp
; 容器主进程本就以 root 运行（需 setuid 子进程），显式声明以消除
; "Privileges were not dropped ... set user=root" CRIT 噪音。
user=root

; supervisorctl 控制通道：unix socket（0700，仅 root 可连）。
; Docker HEALTHCHECK 经 supervisorctl 走本 socket。
[unix_http_server]
file=/tmp/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

; 程序日志约定（各 [program:x] 段共用）：stdout 与 stderr 合并落
; /var/log/supervisor/<程序段名>.log，容器 stdout 不出现程序输出——docker logs 只保留
; 入口脚本的状态行（日志分层见 entrypoint.sh）。按大小轮转：现行文件写到 10MB 即转存
; 为 .log.1（顺延 .log.2），每段最多 3 个文件共 30MB，九个程序段合计上限 270MB。
; 文件跨启动追加，每次拉起前由 lib.sh 的 log_program_start 写入一行带时间戳的启动
; 分隔行。
; 路径与 base/entrypoint.d/lib.sh 的 PROGRAM_LOG_DIR 是同一约定，改动须同步。

; Docker daemon（DinD 模式，数据存内存，容器重启即复原）
; autostart 恒为 false，由 entrypoint 第三波后台任务负责：ENABLE_DOCKERD=1 时
; 经 supervisorctl 运行期拉起（dockerd 无初始化步骤，等 supervisord 就绪即拉）；
; 或运行中手动 supervisorctl start dockerd 拉起。
[program:dockerd]
command=/usr/bin/dockerd --data-root=/tmp/docker --storage-driver=vfs --iptables=false --bridge=none
autostart=false
autorestart=true
startsecs=3
stopwaitsecs=10
stopsignal=TERM
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/supervisor/%(program_name)s.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=2
redirect_stderr=true

; OpenChamber 是容器的主服务入口：Web UI + 托管 opencode serve 子进程，对外提供 4096 端口。
; --foreground 前台运行（配合 supervisord 托管）；监听地址由 OPENCHAMBER_HOST 控制（entrypoint 默认 0.0.0.0）。
; user=app 为占位值：entrypoint 启动时按 SSH_USER 运行期 sed 替换为实际主账号
; （root 或启动时创建的普通用户）；家目录 HOME 固定 /root，与账号名解耦。
[program:openchamber]
command=/usr/local/bin/openchamber serve --port 4096 --foreground
directory=/workspace
user=app
autostart=true
autorestart=true
startsecs=5
stopsignal=TERM
stopasgroup=true
killasgroup=true
environment=HOME="/root",USER="app",SHELL="/bin/bash",OPENCHAMBER_HOST="%(ENV_OPENCHAMBER_HOST)s",OPENCHAMBER_UI_PASSWORD="%(ENV_OPENCHAMBER_UI_PASSWORD)s"
stdout_logfile=/var/log/supervisor/%(program_name)s.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=2
redirect_stderr=true

; Magpie 多 Agent 统一模型网关与 Web 管理界面（默认 3425 网关端口 + 3430 Web UI，
; Web 端口同时反代网关 /v1 路由；容器内 Agent 访问 127.0.0.1:3425 免网关密钥，
; 容器外访问网关须使用 Web UI 中创建的网关密钥）。
; autostart 恒为 false，由 entrypoint 第三波后台任务负责：ENABLE_MAGPIE=1 时
; 校验配置并经 supervisorctl 运行期拉起；或运行中手动 supervisorctl start magpie 拉起。
; user=app 为占位值：entrypoint 启动时按 SSH_USER 运行期 sed 替换为实际主账号
; （root 或启动时创建的普通用户），与 openchamber / 各 Agent 共用 HOME=/root，
; 自动发现容器内 Agent 并保持 /root/.config/magpie、/root/.cache/magpie 属主一致。
; MAGPIE_ADDR / MAGPIE_WEB_KEY / MAGPIE_PUBLIC_URL / MAGPIE_ALLOW_IPS 等全部
; MAGPIE_* 环境变量直接继承自 supervisord 进程环境（不经 INI environment= 展开，
; 避免含逗号或特殊字符时破坏配置解析）。
; stopsignal=TERM 触发 Magpie 优雅排空（默认 7s，可用 MAGPIE_DRAIN 调整）并保存会话状态。
[program:magpie]
command=/usr/local/bin/magpie serve --web=%(ENV_MAGPIE_WEB_ADDR)s
directory=/workspace
user=app
autostart=false
autorestart=true
startsecs=3
stopwaitsecs=15
stopsignal=TERM
stopasgroup=true
killasgroup=true
environment=HOME="/root",USER="app",SHELL="/bin/bash"
stdout_logfile=/var/log/supervisor/%(program_name)s.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=2
redirect_stderr=true

; PostgreSQL 17 本地开发数据库（Debian pg_createcluster 布局：数据
; /var/lib/postgresql/17/main，配置 /etc/postgresql/17/main）。
; autostart 恒为 false，由挂载式 SDK sdks/pg/SDK.sh 后台任务负责：检测/初始化空
; 数据目录（首启 pg_createcluster），完成后经 supervisorctl 运行期拉起（SDK 目录
; 存在且 ENABLE_PG 非 0 时）；手动 supervisorctl start postgresql 拉起要求集群已
; 初始化且配置已由 SDK.sh 放开监听（镜像数据目录留空，未经 SDK.sh 初始化会失败）。
; user=postgres 是 postgresql-17 包预建的固定系统账号（postgres 拒绝以 root 运行），
; 不参与 openchamber 的 user=app 占位符 sed 替换（该 sed 仅精确匹配 ^user=app$）。
; 监听 0.0.0.0:15432（地址与端口均由 SDK.sh 每次启动写入集群配置，Debian 默认本为
; 127.0.0.1:5432）；对外暴露由 compose 端口映射控制（默认不发布），TCP 一律 scram
; 密码认证。
; stopsignal=INT 必须保留：postgres 收 SIGTERM 是 smart shutdown（等所有客户端退出，
; 可能永不结束→stopwaitsecs 强杀→下次启动崩溃恢复），SIGINT 才是 fast shutdown。
[program:postgresql]
command=/usr/lib/postgresql/17/bin/postgres -D /var/lib/postgresql/17/main -c config_file=/etc/postgresql/17/main/postgresql.conf
user=postgres
autostart=false
autorestart=true
startsecs=5
stopwaitsecs=30
stopsignal=INT
stopasgroup=true
killasgroup=true
environment=HOME="/var/lib/postgresql",USER="postgres",SHELL="/bin/bash"
stdout_logfile=/var/log/supervisor/%(program_name)s.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=2
redirect_stderr=true

; MySQL 8.4 本地开发数据库（Debian 布局：数据 /var/lib/mysql，配置
; /etc/mysql/my.cnf → conf.d/mysqld.cnf，socket /var/run/mysqld/mysqld.sock）。
; autostart 恒为 false，由挂载式 SDK sdks/mysql/SDK.sh 后台任务负责：检测/初始化
; 空数据目录（首启 initialize 约 10-30s），完成后经 supervisorctl 运行期拉起
; （SDK 目录存在且 ENABLE_MYSQL 非 0 时）；手动 supervisorctl start mysql 拉起
; 要求系统库已初始化（镜像数据目录留空，未经 SDK.sh 初始化时会失败）。
; user=mysql 为 mysql-community-server 包预建系统账号，同样不参与 user=app sed 替换；
; command 里的 --user=mysql 与 supervisor setuid 保持一致（非 root 运行时仅告警）。
; 监听 0.0.0.0:13306（command 行 --bind-address、--port 覆盖包默认 127.0.0.1:3306，
; 优先级最高、不依赖包配置布局）；对外暴露由 compose 端口映射控制（默认不发布），
; TCP 一律 caching_sha2 密码认证；错误日志写 stderr（并入程序日志 mysql.log）。
[program:mysql]
command=/usr/sbin/mysqld --user=mysql --bind-address=0.0.0.0 --port=13306
user=mysql
autostart=false
autorestart=true
startsecs=10
stopwaitsecs=30
stopsignal=TERM
stopasgroup=true
killasgroup=true
environment=HOME="/var/lib/mysql",USER="mysql",SHELL="/bin/bash"
stdout_logfile=/var/log/supervisor/%(program_name)s.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=2
redirect_stderr=true

; openGauss 7.0.0 LTS 本地开发数据库（华为 GaussDB 开源版；安装 /opt/opengauss，
; 数据 /var/lib/opengauss/data）。autostart 恒为 false，由挂载式 SDK
; sdks/opengauss/SDK.sh 后台任务负责：检测/初始化空数据目录（首启 gs_initdb 约
; 10-30s），完成后经 supervisorctl 运行期拉起（SDK 目录存在且 ENABLE_OPENGAUSS
; 非 0 时）；手动 supervisorctl start opengauss 拉起要求集群已初始化（镜像数据
; 目录留空，未经 SDK.sh 初始化时会失败）。
; user=omm 为镜像预建系统账号（gaussdb 拒绝 root 运行），不参与 user=app sed 替换。
; --single_node 为 gs_initdb --nodename=sgnode 单节点初始化后的官方前台启动方式；
; -p 15433：PGPORT 环境变量与命令行 -p 双保险（端口约定见 sdks/README.md），
; gsql 客户端连接须 -p 15433。gaussdb 另固定监听 port+1
; （15434，官方通信矩阵所称内部工具连接端口 dataPortBase+1，安装后默认开启）；
; 单节点未配置 replconninfo，启动期 "could not create any HA TCP/IP sockets"
; 警告属预期。
; LD_PRELOAD=liblapacke.so.3：gaussdb 硬需 LAPACKE_* 符号，Debian 的 openblas 不含
; LAPACKE 层（CentOS 构建环境的含），运行期注入官方 liblapacke 补齐（见 Dockerfile.base）。
; 监听 0.0.0.0:15433（SDK.sh 首启统一放开，initdb 默认 localhost）；对外暴露
; 由 compose 端口映射控制（默认不发布），TCP 内核强制密码认证。
; 认证：openGauss 内核强制 TCP 一律密码认证（pg_hba trust 不豁免），初始用户 omm
; 的密码由 SDK.sh 首启经统一变量 DB_PASSWORD 传入 gs_initdb；local socket 免密
; 仅限初始用户 omm 以系统账号 omm 身份连接（local trust 仅限初始化用户且与
; 运行数据库的 OS 用户同名），root 等其余身份 TCP、socket 一律密码。客户端命令
; 入口 /usr/local/bin/gsql 由 SDK.sh 每次启动重建（包装脚本设 LD_LIBRARY_PATH
; 指向包内库后转执行 /opt/opengauss/bin/gsql；gsql 不认 PGPASSWORD，-W 须直接
; 带密码参数）：
;   gsql -h 127.0.0.1 -p 15433 -U omm -W "$DB_PASSWORD"
; stopsignal=INT 同 postgresql 段：SIGTERM 是 smart shutdown（等所有客户端退出，可能
; 永不结束→stopwaitsecs 强杀→下次启动崩溃恢复），SIGINT 才是 fast shutdown。
[program:opengauss]
command=/opt/opengauss/bin/gaussdb -D /var/lib/opengauss/data --single_node -p 15433
user=omm
autostart=false
autorestart=true
startsecs=10
stopwaitsecs=60
stopsignal=INT
stopasgroup=true
killasgroup=true
environment=GAUSSHOME="/opt/opengauss",GAUSSLOG="/var/log/opengauss",PGDATA="/var/lib/opengauss/data",PGPORT="15433",LD_LIBRARY_PATH="/opt/opengauss/lib:/opt/opengauss/lib/postgresql",LD_PRELOAD="liblapacke.so.3",HOME="/var/lib/opengauss",USER="omm",SHELL="/bin/bash"
stdout_logfile=/var/log/supervisor/%(program_name)s.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=2
redirect_stderr=true

; KingbaseES V9R2C16 本地开发数据库（人大金仓；安装 /opt/Kingbase/ES/Server，
; 数据 /var/lib/kingbase/data）。autostart 恒为 false，由挂载式 SDK
; sdks/kingbase/SDK.sh 后台任务负责：检测/初始化空数据目录（首启 initdb 约
; 5-15s），完成后经 supervisorctl 运行期拉起（SDK 目录存在且 ENABLE_KINGBASE
; 非 0 时）；手动 supervisorctl start kingbase 拉起要求已初始化（镜像数据目录
; 留空，未经 SDK.sh 初始化时会失败）。
; user=kingbase 为 kingbasees-server 包 preinst 预建的固定系统账号（kingbase
; 二进制拒绝以 root 运行），不参与 openchamber 的 user=app 占位符 sed 替换。
; 前台运行同 postgresql 段形态；-p 54321 即金仓官方默认端口（其余各库的端口约定
; 见 sdks/README.md），配置文件内 port=54321 双保险（SDK.sh 首启写入）。监听
; 0.0.0.0（SDK.sh 首启统一放开，initdb 默认 localhost）；
; 对外暴露由 compose 端口映射控制（默认不发布），TCP 一律 scram-sha-256 认证。
; 二进制 rpath 自足（无需 LD_LIBRARY_PATH/LD_PRELOAD）。
; 认证：初始用户 system 的密码由 SDK.sh 首启经统一变量 DB_PASSWORD 传入
; initdb --pwfile；容器内 local socket 免密（initdb --auth-local=trust，
; 任意系统账号可用）；ksql 命令入口 /usr/local/bin/ksql 由 SDK.sh 每次启动
; 重建（包装脚本转执行 /opt/Kingbase/ES/Server/bin/ksql），默认库须显式指定：
;   ksql -p 54321 -U system -d test
; TCP 用同一客户端加 -h 127.0.0.1，密码环境变量为 KINGBASE_PASSWORD
; （金仓 ksql 不认 PGPASSWORD）。
; stopsignal=INT 同 postgresql/opengauss 段：SIGTERM 是 smart shutdown（等所有
; 客户端退出，可能永不结束→stopwaitsecs 强杀→下次启动崩溃恢复），SIGINT 才是
; fast shutdown。
[program:kingbase]
command=/opt/Kingbase/ES/Server/bin/kingbase -D /var/lib/kingbase/data -p 54321
user=kingbase
autostart=false
autorestart=true
startsecs=10
stopwaitsecs=60
stopsignal=INT
stopasgroup=true
killasgroup=true
environment=HOME="/var/lib/kingbase",USER="kingbase",SHELL="/bin/bash",KINGBASE_DATA="/var/lib/kingbase/data"
stdout_logfile=/var/log/supervisor/%(program_name)s.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=2
redirect_stderr=true

; 达梦 DM8 本地开发数据库（安装 /opt/dmdbms，数据 /var/lib/dm8/data/DAMENG）。
; autostart 恒为 false，由挂载式 SDK sdks/dm/SDK.sh 后台任务负责：检测/初始化空
; 数据目录（首启 dminit <1s，日志文件预写 ~0.8G），完成后经 supervisorctl 运行期
; 拉起（SDK 目录存在且 ENABLE_DM 非 0 时）；手动 supervisorctl start dm 拉起要求
; 实例已初始化（镜像数据目录留空，未经 SDK.sh 初始化时会失败）。
; user=dmdba 为镜像预建系统账号（Dockerfile.base 静默安装层创建，官方约定
; 非 root 运行），不参与 openchamber 的 user=app 占位符 sed 替换。
; -noconsole 服务模式前台运行；端口 15236 来自 dm.ini 的 PORT_NUM（SDK.sh 首启
; dminit 写入、每次启动对齐），dmserver 默认监听 *:15236；对外暴露由 compose
; 端口映射控制（默认不发布），TCP 一律
; 密码认证（达梦无 local socket 免密通道，SYSDBA/SYSAUDITOR 密码均为 DB_PASSWORD，
; SDK.sh 首启经 runuser 直传 argv 写入）。
; 二进制自包含（bookworm-slim ldd 零缺失，无需 LD_LIBRARY_PATH/软链）。
; LANG=zh_CN.UTF-8：disql 只识别语言型 locale（zh_CN.UTF-8 等），C.UTF-8/未设
; 时回退 GBK 双字节扫描，UTF-8 中文字面量奇数字节报 -2048 语法错
; （zh_CN.utf8 为镜像 locales 自带）。
; stopsignal=TERM 优雅关停（完成检查点后退出）；stopwaitsecs=60 留足大缓冲。
; 容器内连接（disql 命令入口 /usr/local/bin/disql 由 SDK.sh 每次启动重建，包装脚本
; 转执行 /opt/dmdbms/bin/disql）：disql 'SYSDBA/"$DB_PASSWORD"@localhost:15236'。
[program:dm]
command=/opt/dmdbms/bin/dmserver /var/lib/dm8/data/DAMENG/dm.ini -noconsole
user=dmdba
autostart=false
autorestart=true
startsecs=10
stopwaitsecs=60
stopsignal=TERM
stopasgroup=true
killasgroup=true
environment=HOME="/var/lib/dm8",USER="dmdba",SHELL="/bin/bash",DM_HOME="/opt/dmdbms",LANG="zh_CN.UTF-8"
stdout_logfile=/var/log/supervisor/%(program_name)s.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=2
redirect_stderr=true

; Redis 7 本地缓存/数据库（Debian 布局：二进制 /usr/bin/redis-server，包配置
; /etc/redis/redis.conf，数据 /var/lib/redis）。
; autostart 恒为 false，由挂载式 SDK sdks/redis/SDK.sh 后台任务负责：每次启动把
; 统一密码 DB_PASSWORD 写入包配置（requirepass + ACL 用户 redis），完成后经
; supervisorctl 运行期拉起（SDK 目录存在且 ENABLE_REDIS 非 0 时）。手动
; supervisorctl start redis 拉起时若配置内尚无密码行（未经 SDK.sh 写入），
; protected-mode 生效，仅接受本机连接。
; user=redis 为 redis-server 包预建系统账号，不参与 user=app sed 替换。
; command 行覆盖包配置的运行形态（命令行参数优先级高于配置文件）：
; --daemonize no 前台运行（包默认 daemonize yes，与 supervisord 托管互斥）；
; --bind "0.0.0.0 -::1" 监听全部接口（包默认仅回环；对外暴露由 compose 端口
; 映射控制，默认不发布）——显式指定 bind 会使 protected-mode 自动失效，故以
; --protected-mode yes 显式保持"无密码即拒绝非本机连接"的包默认安全语义；
; --port 16379 监听端口（包默认 6379；端口约定见 sdks/README.md）；
; --logfile "" 日志进 stdout/stderr，由 supervisord 收进程序日志 redis.log
; （包默认 /var/log/redis/redis-server.log）。
; stopsignal=TERM：Redis 收 SIGTERM 完成保存（按包默认 save 点落 RDB）后退出。
[program:redis]
command=/usr/bin/redis-server /etc/redis/redis.conf --daemonize no --bind "0.0.0.0 -::1" --protected-mode yes --port 16379 --logfile ""
user=redis
autostart=false
autorestart=true
startsecs=5
stopwaitsecs=30
stopsignal=TERM
stopasgroup=true
killasgroup=true
environment=HOME="/var/lib/redis",USER="redis",SHELL="/bin/bash"
stdout_logfile=/var/log/supervisor/%(program_name)s.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=2
redirect_stderr=true
