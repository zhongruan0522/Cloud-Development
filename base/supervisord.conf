; 用 supervisord 托管 OpenChamber 等主服务，避免同容器多进程无人看护。
[supervisord]
nodaemon=true
logfile=/tmp/supervisord.log
pidfile=/tmp/supervisord.pid
childlogdir=/tmp

; supervisorctl 控制通道：unix socket（0700，仅 root 可连）。
; 不启用 [inet_http_server]（supervisor 自带 web 界面），减少攻击面；
; Docker HEALTHCHECK 经 supervisorctl 走本 socket，功能不变。
[unix_http_server]
file=/tmp/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

; Docker daemon（DinD 模式，数据存内存，容器重启即复原）
; 默认不自启以节省内存（~200-500 MB），通过 ENABLE_DOCKERD=1 开启开机自启，
; 或运行中手动 supervisorctl start dockerd 拉起。
[program:dockerd]
command=/usr/bin/dockerd --data-root=/tmp/docker --storage-driver=vfs --iptables=false --bridge=none
autostart=false
autorestart=true
startsecs=3
stopwaitsecs=10
stopsignal=TERM
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

; OpenChamber 是容器的主服务入口：Web UI + 托管 opencode serve 子进程，对外提供 4096 端口。
; --foreground 前台运行（配合 supervisord 托管）；监听地址由 OPENCHAMBER_HOST 控制（entrypoint 默认 0.0.0.0）。
[program:openchamber]
command=/usr/local/bin/openchamber serve --port 4096 --foreground
directory=/workspace
user=app
autostart=true
autorestart=true
startsecs=5
stopsignal=TERM
stopasgroup=true
killasgroup=true
environment=HOME="/home/app",USER="app",SHELL="/bin/bash",OPENCHAMBER_HOST="%(ENV_OPENCHAMBER_HOST)s",OPENCHAMBER_UI_PASSWORD="%(ENV_OPENCHAMBER_UI_PASSWORD)s"
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

; Serena MCP 常驻服务（streamable-http 模式，仅容器内 127.0.0.1:9121 可达）：
; Codex / OpenCode 等客户端全部连这一个 server，共享同一份语言服务器进程，
; 避免 stdio 模式下每个客户端会话（尤其子代理）各起一个 LSP 把内存打爆。
; 随容器自启，供容器内 MCP 客户端连接；失败由 supervisorctl / healthcheck 显式暴露。
; 项目激活：客户端内用 activate_project 指定路径即可，无需 --project-from-cwd（HTTP 模式下无意义）。
; 不同项目的并发隔离需要按官方文档为每个项目启动独立 Serena 实例。
[program:serena]
command=/usr/local/bin/serena start-mcp-server --context ide --transport streamable-http --host 127.0.0.1 --port 9121 --open-web-dashboard false
directory=/workspace
user=app
autostart=true
autorestart=true
startsecs=5
stopsignal=TERM
stopasgroup=true
killasgroup=true
environment=HOME="/home/app",USER="app",SHELL="/bin/bash"
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
