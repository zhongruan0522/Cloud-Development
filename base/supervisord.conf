; 用 supervisord 托管 OpenChamber 等主服务，避免同容器多进程无人看护。
[supervisord]
nodaemon=true
logfile=/tmp/supervisord.log
pidfile=/tmp/supervisord.pid
childlogdir=/tmp
; 容器主进程本就以 root 运行（需 setuid 子进程），显式声明以消除
; "Privileges were not dropped ... set user=root" CRIT 噪音。
user=root

; supervisorctl 控制通道：unix socket（0700，仅 root 可连）。
; 不启用 [inet_http_server]（supervisor 自带 web 界面），减少攻击面；
; Docker HEALTHCHECK 经 supervisorctl 走本 socket，功能不变。
[unix_http_server]
file=/tmp/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

; Docker daemon（DinD 模式，数据存内存，容器重启即复原）
; 默认不自启以节省内存（~200-500 MB），通过 ENABLE_DOCKERD=1 开启开机自启，
; 或运行中手动 supervisorctl start dockerd 拉起。
[program:dockerd]
command=/usr/bin/dockerd --data-root=/tmp/docker --storage-driver=vfs --iptables=false --bridge=none
autostart=false
autorestart=true
startsecs=3
stopwaitsecs=10
stopsignal=TERM
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

; OpenChamber 是容器的主服务入口：Web UI + 托管 opencode serve 子进程，对外提供 4096 端口。
; --foreground 前台运行（配合 supervisord 托管）；监听地址由 OPENCHAMBER_HOST 控制（entrypoint 默认 0.0.0.0）。
; user=app 为占位值：entrypoint 启动时按 SSH_USER 运行期 sed 替换为实际主账号
; （root 或启动时创建的普通用户）；家目录 HOME 固定 /root，与账号名解耦。
[program:openchamber]
command=/usr/local/bin/openchamber serve --port 4096 --foreground
directory=/workspace
user=app
autostart=true
autorestart=true
startsecs=5
stopsignal=TERM
stopasgroup=true
killasgroup=true
environment=HOME="/root",USER="app",SHELL="/bin/bash",OPENCHAMBER_HOST="%(ENV_OPENCHAMBER_HOST)s",OPENCHAMBER_UI_PASSWORD="%(ENV_OPENCHAMBER_UI_PASSWORD)s"
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

; Serena MCP 常驻服务（streamable-http 模式，仅容器内 127.0.0.1:9121 可达）：
; Codex / OpenCode 等客户端全部连这一个 server，共享同一份语言服务器进程，
; 避免 stdio 模式下每个客户端会话（尤其子代理）各起一个 LSP 把内存打爆。
; 随容器自启，供容器内 MCP 客户端连接；失败由 supervisorctl / healthcheck 显式暴露。
; 项目激活：客户端内用 activate_project 指定路径即可，无需 --project-from-cwd（HTTP 模式下无意义）。
; 不同项目的并发隔离需要按官方文档为每个项目启动独立 Serena 实例。
[program:serena]
command=/usr/local/bin/serena start-mcp-server --context ide --transport streamable-http --host 127.0.0.1 --port 9121 --open-web-dashboard false
directory=/workspace
user=app
autostart=true
autorestart=true
startsecs=5
stopsignal=TERM
stopasgroup=true
killasgroup=true
environment=HOME="/root",USER="app",SHELL="/bin/bash"
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

; PostgreSQL 17 本地开发数据库（Debian pg_createcluster 布局：数据
; /var/lib/postgresql/17/main，配置 /etc/postgresql/17/main）。
; autostart 恒为 false，由 entrypoint 后台并行任务负责：检测/初始化空数据目录
; （首启 pg_createcluster），完成后经 supervisorctl 运行期拉起（ENABLE_PG=1 时）；
; 手动 supervisorctl start postgresql 拉起要求集群已初始化
; （镜像数据目录留空，未跑过首启初始化时会失败，同 openGauss 先例）。
; user=postgres 是 postgresql-17 包预建的固定系统账号（postgres 拒绝以 root 运行），
; 不参与 openchamber 的 user=app 占位符 sed 替换（该 sed 仅精确匹配 ^user=app$）。
; 监听 0.0.0.0:5432（entrypoint 每次启动统一放开，Debian 默认本为 127.0.0.1）；
; 对外暴露由 compose 端口映射控制（默认不发布），TCP 一律 scram 密码认证。
; stopsignal=INT 必须保留：postgres 收 SIGTERM 是 smart shutdown（等所有客户端退出，
; 可能永不结束→stopwaitsecs 强杀→下次启动崩溃恢复），SIGINT 才是 fast shutdown。
[program:postgresql]
command=/usr/lib/postgresql/17/bin/postgres -D /var/lib/postgresql/17/main -c config_file=/etc/postgresql/17/main/postgresql.conf
user=postgres
autostart=false
autorestart=true
startsecs=5
stopwaitsecs=30
stopsignal=INT
stopasgroup=true
killasgroup=true
environment=HOME="/var/lib/postgresql",USER="postgres",SHELL="/bin/bash"
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

; MySQL 8.4 本地开发数据库（Debian 布局：数据 /var/lib/mysql，配置
; /etc/mysql/my.cnf → conf.d/mysqld.cnf，socket /var/run/mysqld/mysqld.sock）。
; autostart 恒为 false，由 entrypoint 后台并行任务负责：检测/初始化空数据目录
; （首启 initialize 约 10-30s），完成后经 supervisorctl 运行期拉起（ENABLE_MYSQL=1
; 时）；手动 supervisorctl start mysql 拉起要求系统库已初始化（镜像数据目录留空，
; 未跑过首启初始化时会失败，同 PG/openGauss 先例）。
; user=mysql 为 mysql-community-server 包预建系统账号，同样不参与 user=app sed 替换；
; command 里的 --user=mysql 在 supervisor setuid 后为冗余双保险（非 root 运行时仅告警）。
; 监听 0.0.0.0:3306（command 行 --bind-address 覆盖包默认 127.0.0.1，优先级最高、
; 不依赖包配置布局）；对外暴露由 compose 端口映射控制（默认不发布），TCP 一律
; caching_sha2 密码认证；错误日志已落 stderr。
[program:mysql]
command=/usr/sbin/mysqld --user=mysql --bind-address=0.0.0.0
user=mysql
autostart=false
autorestart=true
startsecs=10
stopwaitsecs=30
stopsignal=TERM
stopasgroup=true
killasgroup=true
environment=HOME="/var/lib/mysql",USER="mysql",SHELL="/bin/bash"
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

; openGauss 7.0.0 LTS 本地开发数据库（华为 GaussDB 开源版；安装 /opt/opengauss，
; 数据 /var/lib/opengauss/data）。autostart 恒为 false，由 entrypoint 后台并行
; 任务负责：检测/初始化空数据目录（首启 gs_initdb 约 10-30s），完成后经
; supervisorctl 运行期拉起（ENABLE_OPENGAUSS=1 时）；手动 supervisorctl start
; opengauss 拉起要求集群已初始化（镜像数据目录留空，未跑过首启初始化时会失败）。
; user=omm 为镜像预建系统账号（gaussdb 拒绝 root 运行），不参与 user=app sed 替换。
; --single_node 为 gs_initdb --nodename=sgnode 单节点初始化后的官方前台启动方式；
; -p 5433：端口避让 PostgreSQL 17 的 5432，两库可同时启用（PGPORT 环境变量
; 与命令行 -p 双保险，gsql 客户端连接须 -p 5433）；gaussdb 另监听 127.0.0.1:5434
; （port+1，单节点内置流复制/HA 通道，仅本机，无需理会）。
; LD_PRELOAD=liblapacke.so.3：gaussdb 硬需 LAPACKE_* 符号，Debian 的 openblas 不含
; LAPACKE 层（CentOS 构建环境的含），运行期注入官方 liblapacke 补齐（见 Dockerfile.base）。
; 监听 0.0.0.0:5433（entrypoint 首启统一放开，initdb 默认 localhost）；对外暴露
; 由 compose 端口映射控制（默认不发布），TCP 内核强制密码认证。
; 认证：openGauss 内核强制 TCP 一律密码认证（pg_hba trust 不豁免），初始用户 omm
; 的密码由 entrypoint 首启经三库统一变量 DB_PASSWORD 传入 gs_initdb；容器内 local
; socket 免密（gsql -p 5433 -d postgres）；TCP 用 gsql -h 127.0.0.1 -p 5433 -U omm
; -W "$DB_PASSWORD"（openGauss gsql 不认 PGPASSWORD，且 -W 与原生 psql 不同、
; 须直接带密码参数，实测无参报 "The option '-W' need a parameter"）。
; stopsignal=INT 同 postgresql 段：SIGTERM 是 smart shutdown（等所有客户端退出，可能
; 永不结束→stopwaitsecs 强杀→下次启动崩溃恢复），SIGINT 才是 fast shutdown。
[program:opengauss]
command=/opt/opengauss/bin/gaussdb -D /var/lib/opengauss/data --single_node -p 5433
user=omm
autostart=false
autorestart=true
startsecs=10
stopwaitsecs=60
stopsignal=INT
stopasgroup=true
killasgroup=true
environment=GAUSSHOME="/opt/opengauss",GAUSSLOG="/var/log/opengauss",PGDATA="/var/lib/opengauss/data",PGPORT="5433",LD_LIBRARY_PATH="/opt/opengauss/lib:/opt/opengauss/lib/postgresql",LD_PRELOAD="liblapacke.so.3",HOME="/var/lib/opengauss",USER="omm",SHELL="/bin/bash"
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
